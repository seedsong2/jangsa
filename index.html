const UI = window.UI, E = UI.E;
const MAN = E.MAN;
const fin = v => (isFinite(v) ? v : 0);
const LBX = () => window.LB || { rows: [], status: 'local', readOnly: false, summary: () => ({ players: 0, winners: 0, plays: 0, wins: 0, winRate: 0, myRank: 0, mine: null, status: 'local', readOnly: false }) };

/* "3년 2개월" / "7개월" / "1년" */
function dur(m) {
  m = Math.max(0, Math.round(fin(m)));
  if (m === 0) return '개업 직후';
  const y = Math.floor(m / 12), r = m % 12;
  return (y ? y + '년' : '') + (y && r ? ' ' : '') + (r ? r + '개월' : '');
}
function tierOf(score) {
  if (score >= 10000 * MAN) return '장사의 신';
  if (score >= 3000 * MAN) return '골목의 고수';
  if (score > 0) return '살아남은 사장님';
  if (score > -3000 * MAN) return '본전도 못 건진 사장님';
  if (score > -10000 * MAN) return '빚만 남은 사장님';
  return '모든 것을 잃은 사장님';
}
const toneOf = v => (v > 0 ? 'good' : v < 0 ? 'bad' : '');

/* ───────── 리더보드 표 (타이틀·결과 공용) ───────── */
UI.leaderboardHTML = function (opts) {
  const limit = Math.max(1, (opts && opts.limit) || 10);
  const LB = LBX(), rows = LB.rows || [], S = LB.summary();
  const st = { shared: ['good', '전체 사장님 공유'], loading: ['info', '불러오는 중'], offline: ['warn', '연결이 늦어지고 있습니다'], local: ['', '이 기기 기록만 표시'] }[S.status] || ['', '이 기기 기록만 표시'];
  let h = `<div class="mt-lb"><div class="spread"><h3>리더보드</h3><span class="tag ${st[0]}">${st[1]}</span></div>`;
  if (S.readOnly && S.status === 'shared') h += `<p class="hint warn small">보기 전용이라 내 기록은 이 기기에만 저장됩니다.</p>`;
  if (!rows.length) {
    return h + `<div class="mt-empty"><b>아직 기록이 없습니다.</b><span>첫 번째 사장님이 되어 보세요.</span></div></div>`;
  }
  h += `<p class="sub mt-lb-sum">흑자 ${UI.int(S.wins)}/${UI.int(S.plays)}회 (${UI.pct(S.winRate)}) · 사장님 ${UI.int(S.winners)}/${UI.int(S.players)}명 흑자</p>`;
  const row = (r, rank) => {
    const kind = UI.END_KO[r.type];
    return `<tr class="${r.me ? 'me' : ''}"><td class="num">${rank}</td>` +
      `<td class="mt-nm">${UI.esc(r.name)}${r.me ? ' <span class="tag accent">나</span>' : ''}</td>` +
      `<td class="r">${UI.money(r.best, true)}</td>` +
      `<td class="nowrap">${kind ? UI.esc(kind) + ' ' : ''}<span class="muted">${UI.int(r.months)}개월</span></td>` +
      `<td>${UI.esc(r.loc || '-')}</td><td class="r num">${UI.int(r.plays)}회</td></tr>`;
  };
  let body = rows.slice(0, limit).map((r, i) => row(r, i + 1)).join('');
  if (S.myRank > limit) body += `<tr class="mt-gap"><td colspan="6" class="center muted">⋯</td></tr>` + row(S.mine, S.myRank);
  h += `<div class="tbl-wrap"><table class="tbl mt-tbl"><thead><tr><th>순위</th><th>사장님</th><th class="r">최고 순수익</th><th>결과</th><th>상가</th><th class="r">도전</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  return h;
};

/* ───────── 결과 화면 ───────── */
function chartSVG(hist) {
  const v = hist.map(h => fin(h.cash)), n = v.length;
  if (!n) return '';
  const W = 600, H = 150, P = 10;
  let lo = Math.min(0, ...v), hi = Math.max(0, ...v);
  if (hi === lo) hi = lo + 1;
  const x = i => (n === 1 ? W / 2 : P + (W - 2 * P) * i / (n - 1));
  const y = val => P + (H - 2 * P) * (1 - (val - lo) / (hi - lo));
  const pts = v.map((val, i) => x(i).toFixed(1) + ',' + y(val).toFixed(1)).join(' ');
  const y0 = y(0).toFixed(1);
  return `<svg class="mt-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="월별 통장 잔액 추이">` +
    (lo < 0 ? `<rect class="mt-neg" x="0" y="${y0}" width="${W}" height="${(H - y(0)).toFixed(1)}"/>` : '') +
    `<line class="mt-zero" x1="0" x2="${W}" y1="${y0}" y2="${y0}"/>` +
    (n > 1 ? `<polyline class="mt-line" points="${pts}"/>` : '') +
    `<circle class="mt-dot" cx="${x(n - 1).toFixed(1)}" cy="${y(v[n - 1]).toFixed(1)}" r="4"/></svg>`;
}

function analyze(G) {
  const R = G.result, T = G.tot || {}, m = Math.max(0, R.month || 0), rev = fin(T.rev);
  const hist = G.hist || [], log = G.log || [];
  const out = [];
  const share = v => (rev > 0 ? fin(v) / rev : 0);
  if (rev > 0) {
    if (share(T.rent) > .15) out.push([share(T.rent) / .15, `임대료가 매출의 ${UI.pct(share(T.rent))}였습니다. 보통 10% 안팎이어야 버팁니다.`]);
    if (share(T.labor) > .30) out.push([share(T.labor) / .30, `인건비가 매출의 ${UI.pct(share(T.labor))}였습니다. 직원 수나 월급이 매출에 비해 무거웠습니다.`]);
    if (share(T.cogs) > .45) out.push([share(T.cogs) / .45, `재료비가 매출의 ${UI.pct(share(T.cogs))}였습니다. 가격을 올리거나 원가가 낮은 메뉴를 늘려야 남습니다.`]);
  }
  if (m > 0) {
    const fixed = (fin(T.rent) + fin(T.labor) + fin(T.interest) + fin(T.living)) / m, avg = rev / m;
    if (avg < fixed) out.push([2.5, `월평균 매출 ${UI.won(avg)}로는 월 고정 지출 ${UI.won(fixed)}(임대료·인건비·이자·생활비)도 감당하지 못했습니다.`]);
  }
  const loss = hist.filter(h => fin(h.op) < 0).length;
  if (hist.length && loss >= 3 && loss / hist.length >= .2) out.push([loss / hist.length / .2, `${hist.length}개월 중 ${loss}개월이 적자였습니다.`]);
  const peak = hist.reduce((a, h) => Math.max(a, fin(h.debt)), 0);
  if (peak >= 5000 * MAN) out.push([peak / (10000 * MAN), `대출 잔액이 가장 많을 때 ${UI.won(peak)}이었습니다. 이자와 상환금이 매달 통장을 눌렀습니다.`]);
  const bad = log.filter(e => e.tone === 'bad' && e.m > 0);
  if (bad.length >= 3) out.push([bad.length / 3, `나쁜 사건이 ${bad.length}번 있었습니다. 운영자금이 넉넉했다면 버틸 수 있는 충격이었는지 돌아보세요.`]);
  out.sort((a, b) => b[0] - a[0]);
  let obs = out.slice(0, 3).map(o => o[1]);
  if (!obs.length) obs = [R.score > 0 ? `눈에 띄는 약점 없이 운영했습니다. 월평균 영업이익은 ${UI.won(m ? fin(T.op) / m : 0)}이었습니다.` : '한 가지 큰 원인보다는 여러 비용이 조금씩 쌓여 결과가 나왔습니다.'];
  // 가장 힘들었던 달에 겹친 나쁜 사건 5개 (시간순)
  const net = mm => { const h = hist[mm - 1]; return h ? fin(h.net) : 0; };
  const worst = bad.map((e, i) => ({ e, i })).sort((a, b) => net(a.e.m) - net(b.e.m) || a.i - b.i).slice(0, 5).sort((a, b) => a.i - b.i).map(o => o.e);
  return { obs, worst };
}

/* 다른 길과 비교: 5,000만원을 예금에 넣고 같은 시간을 최저임금으로 일했다면 */
const MIN_WAGE = 10320;   // 2026년 최저시급(원)
function compare(G) {
  const R = G.result, T = G.tot || {}, m = Math.max(0, R.month || 0), score = fin(R.score), seed = E.TUNE.seed;
  const ops = G.ops || {}, hrs = (E.HOURS[ops.hours] || E.HOURS.std).h;
  const worked = m * (ops.dayOff ? 26 : 30) * hrs;
  const living = fin(T.living), kept = score + living;
  const bank = seed * (Math.pow(1.03, m / 12) - 1), minPay = worked * MIN_WAGE;
  const log = (G.log || []).filter(e => e.m > 0);
  const cnt = re => log.filter(e => re.test(e.title || '')).length;
  const marks = [
    ['응급실', cnt(/쓰러짐|정신적 과로|건강 악화/), '번'],
    ['그만둔 직원', cnt(/퇴사/), '명'],
    ['급하게 메운 돈', cnt(/긴급 대출|손을 벌림|잔고 부족/), '번'],
    ['집안 다툼', cnt(/아내의 한숨|들켜|집에서 온|그만하자|아내의 손목/), '번'],
    ['떠난 단골', cnt(/단골이 떠났습니다/), '명'],
    ['고장·파손', cnt(/고장|파손|역류|동파|정전|누수/), '번']
  ];
  if ((G.flags || {}).famDiv) marks.push(['가정', '이혼', '']); else if ((G.flags || {}).famSep) marks.push(['가정', '별거 중', '']);
  return { m, score, seed, worked, living, kept, bank, minPay, hourly: worked > 0 ? kept / worked : 0, marks };
}

function locDetail(G, L) {
  const mx = maxSegPop(), chosen = G.loc && G.loc.id === L.id;
  const bars = SEGS.map(s => `<div class="su-seg"><span class="dot ${s}"></span><span class="su-seg-n">${esc(E.SEG_KO[s])}</span><span class="bar"><i style="width:${(L.pop[s] / mx * 100).toFixed(1)}%;background:var(--seg-${s})"></i></span><span class="num tiny">${UI.int(L.pop[s])}</span></div>`).join('');
  return `<div class="card su-detail" id="su-detail">
    <div class="spread"><h3>${L.no}번 ${esc(L.name)}</h3>${chosen ? '<span class="tag good">계약함</span>' : ''}</div>
    <p class="sub">${esc(L.desc)}</p>
    <div class="su-kv">
      <div><span class="k">크기</span><span>${L.size}평 · 테이블 최대 ${Math.floor((L.size - 3.5) * 0.8)}개</span></div>
      <div><span class="k">보증금</span><span class="num">${won(L.deposit)}</span></div>
      <div><span class="k">월세+관리비</span><span class="num">${won(L.rent + L.mgmt)}</span></div>
      <div><span class="k">권리금</span><span class="num">${L.premium ? won(L.premium) : '없음'}</span></div>
    </div>
    ${L.rentFree ? `<div class="tag accent">첫 ${L.rentFree}개월 월세 면제</div>` : ''}
    <div class="stack tight">
      <div class="spread"><h4>하루 손님 후보</h4><b class="num small">하루 약 ${UI.int(totalPop(L))}명</b></div>
      ${bars}
    </div>
    <div class="su-kv">
      <div><span class="k">가시성</span><span>${visLabel(L.vis)}</span></div>
      <div><span class="k">신규 경쟁 위험</span><span>${riskLabel(L.newComp)}</span></div>
      <div class="wide"><span class="k">현재 경쟁 가게</span><span>${esc(compText(L))}</span></div>
    </div>
    ${chosen
      ? `<button class="btn block" disabled>계약함</button>`
      : `<button class="btn primary block" data-act="suChoose" data-arg="${L.id}" id="su-choose">이 상가로 계약</button>`}
    
  </div>`;
}

function locTable(G, sel) {
  const rows = E.LOCS.map(L => {
    const ms = mainSeg(L), chosen = G.loc && G.loc.id === L.id;
    return `<tr class="${sel === L.id ? 'me' : ''}" data-act="suPreview" data-arg="${L.id}" style="cursor:pointer">
      <td class="num">${L.no}</td>
      <td><button class="btn ghost sm" data-act="suPreview" data-arg="${L.id}" id="su-row-${L.id}">${esc(L.name)}</button>${chosen ? ' <span class="tag good">계약</span>' : ''}</td>
      <td class="r num">${L.size}평</td>
      <td class="r num">${won(L.rent + L.mgmt)}</td>
      <td class="r num">${L.premium ? won(L.premium) : '없음'}</td>
      <td><span class="row" style="gap:5px;flex-wrap:nowrap"><span class="dot ${ms}"></span>${esc(E.SEG_KO[ms])}</span></td>
    </tr>`;
  }).join('');
  return `<div class="card"><h3>상가 12곳 한눈에 비교</h3><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>번호</th><th>이름</th><th class="r">평수</th><th class="r">월세</th><th class="r">권리금</th><th>주 고객</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function stepLoc(G) {
  const sel = UI.state.selLoc && E.LOC_BY[UI.state.selLoc] ? UI.state.selLoc : (G.loc ? G.loc.id : null);
  const L = sel ? E.LOC_BY[sel] : null;
  return `<div class="stack">
    ${head('입지 고르기')}
    <div class="card su-mapcard">${mapSvg(G, sel)}
      <div class="su-maplegend tiny muted"><span><i class="lg n"></i>상가</span><span><i class="lg p"></i>미리보기</span><span><i class="lg c"></i>계약함</span></div></div>
    ${L ? locDetail(G, L) : `<div class="card flat"><p class="sub">지도나 표에서 상가를 고르세요.</p></div>`}
    ${locTable(G, sel)}
  </div>`;
}

/* ───────── 3단계: 가게 꾸미기 ───────── */
function floorPlan(G) {
  const max = E.maxTables(G), n = Math.min(G.tables, max);
  const W = 240, H = 120;
  const kw = max > 0 ? Math.round(70 + (max - n) / max * 50) : 120;
  let t = '';
  const hallX = kw + 12, hallW = W - hallX - 8, pitch = 24, cols = Math.max(1, Math.floor(hallW / pitch));
  for (let i = 0; i < n; i++) t += `<rect class="tb" x="${hallX + (i % cols) * pitch}" y="${12 + Math.floor(i / cols) * pitch}" width="18" height="18" rx="3"/>`;
  return `<svg class="su-floor" viewBox="0 0 ${W} ${H}" role="img" aria-label="매장 배치도: 주방과 테이블 ${n}개">
    <rect class="room" x="2" y="2" width="${W - 4}" height="${H - 4}" rx="4"/>
    <rect class="kit" x="2" y="2" width="${kw}" height="${H - 4}" rx="4"/>
    <text class="fl" x="${2 + kw / 2}" y="${H / 2 + 4}" text-anchor="middle">주방</text>
    ${t}
    ${n === 0 ? `<text class="fl" x="${hallX + hallW / 2}" y="${H / 2 + 4}" text-anchor="middle">테이블 없음</text>` : ''}
  </svg>`;
}
function stepShop(G) {
  const L = G.loc ? E.LOC_BY[G.loc.id] : null, max = E.maxTables(G);
  const inter = Object.keys(E.INTERIOR).map(k => {
    const o = E.INTERIOR[k];
    return `<button class="opt ${G.interior === k ? 'sel' : ''}" data-act="suInterior" data-arg="${k}" aria-pressed="${G.interior === k}">
      <span class="t">${esc(o.name)}</span><span class="d">${esc(o.desc)}</span>
      <span class="p">${L ? `${won(o.perPy * L.size)} <span class="tiny muted">평당 ${won(o.perPy)} × ${L.size}평</span>` : `평당 ${won(o.perPy)}`}</span></button>`;
  }).join('');
  const equip = Object.keys(E.EQUIP).map(k => {
    const o = E.EQUIP[k];
    return `<button class="opt ${G.equip === k ? 'sel' : ''}" data-act="suEquip" data-arg="${k}" aria-pressed="${G.equip === k}">
      <span class="t">${esc(o.name)}</span><span class="d">${esc(o.desc)}</span><span class="p">${won(o.cost)}</span></button>`;
  }).join('');
  return `<div class="stack">
    ${head('가게 꾸미기')}
    <div class="stack tight"><h3>인테리어</h3><div class="opts">${inter}</div></div>
    <div class="stack tight"><h3>주방설비</h3><div class="opts">${equip}</div></div>
    <div class="card">
      <h3>테이블</h3>
      ${L ? `<div class="su-tables">
        <div class="stack tight">
          <div class="row"><div class="stepper" role="group" aria-label="테이블 수">
            <button data-act="suTables" data-arg="-1" aria-label="테이블 줄이기" ${G.tables <= 0 ? 'disabled' : ''}>−</button>
            <span class="val" id="su-tables-val">${G.tables}세트</span>
            <button data-act="suTables" data-arg="1" aria-label="테이블 늘리기" ${G.tables >= max ? 'disabled' : ''}>+</button></div>
            <span class="sub small">최대 ${max}세트 · 한 세트 ${won(E.TABLE_COST)}</span></div>
          <p class="sub small">테이블을 줄이면 주방이 넓어집니다.</p>
        </div>${floorPlan(G)}</div>`
        : `<p class="sub">입지를 먼저 고르세요.</p>`}
    </div>
    <div class="card stack tight">
      <h3>개업 준비 옵션</h3>
      <label class="switch"><input type="checkbox" id="su-training" data-change="suTraining" ${G.training ? 'checked' : ''}> 김밥 조리 전수 교육 <b class="num">300만원</b></label>
      <div class="sub small">맛과 재료 손실이 개선됩니다.</div>
      <label class="switch"><input type="checkbox" id="su-event" data-change="suEvent" ${G.openEvent ? 'checked' : ''}> 오픈 이벤트 <b class="num">150만원</b></label>
      <div class="sub small">초기 인지도가 오릅니다.</div>
    </div>
  </div>`;
}

/* ───────── 4단계: 메뉴 ───────── */
function menuRow(G, id) {
  const it = E.MENU[id], on = !!G.menu[id], ico = UI.MENU_ICON[id] || '';
  const cost = E.unitCost(G, id), ref = E.refPrice(G, id);
  if (!on) {
    return `<div class="su-mrow off">
      <label class="switch su-m-sw"><input type="checkbox" id="su-menu-${id}" data-id="${id}" data-change="suMenu"> <span class="su-m-name"><span aria-hidden="true">${ico}</span> ${esc(it.name)}</span></label>
      <span class="small muted">원가 ${UI.price(cost)} · 시세 ${UI.price(ref)}</span>
      <span class="su-m-likes">${segDots(it.fit)}</span>
      ${it.fryer ? '<span class="tag warn">튀김기 필요</span>' : ''}
    </div>`;
  }
  const p = G.menu[id].price, d = p / ref - 1, dp = Math.round(d * 100);
  const tcls = d >= 0.1 ? 'warn' : d <= -0.05 ? 'good' : '';
  const margin = (p - cost) / p;
  const fixed = id === 'gimbap';
  return `<div class="su-mrow">
    <label class="switch su-m-sw"><input type="checkbox" id="su-menu-${id}" data-id="${id}" data-change="suMenu" checked ${fixed ? 'disabled' : ''}> <span class="su-m-name"><span aria-hidden="true">${ico}</span> ${esc(it.name)}</span></label>
    ${fixed ? '<span class="tag">기본 메뉴</span>' : ''}
    <span class="su-m-price"><span class="stepper" role="group" aria-label="${esc(it.name)} 판매가">
      <button data-act="suPrice" data-arg="${id}:-100" aria-label="100원 내리기">−</button><span class="val">${UI.price(p)}</span><button data-act="suPrice" data-arg="${id}:100" aria-label="100원 올리기">+</button></span></span>
    <span class="tag ${tcls}">시세 ${dp > 0 ? '+' : ''}${dp}%</span>
    <span class="small muted">원가 ${UI.price(cost)} · 마진 <b class="num ${margin < 0.45 ? 'warn' : ''}">${Math.round(margin * 100)}%</b></span>
    <span class="su-m-likes">${segDots(it.fit)}</span>
    ${it.fryer ? '<span class="tag warn">튀김기 필요</span>' : ''}
  </div>`;
}
function stepMenu(G) {
  const grades = Object.keys(E.GRADE).map(k => {
    const o = E.GRADE[k];
    return `<button class="opt ${G.grade === k ? 'sel' : ''}" data-act="suGrade" data-arg="${k}" aria-pressed="${G.grade === k}">
      <span class="t">${esc(o.name)}</span><span class="d">${esc(o.desc)}</span><span class="p">원가 ×${o.cost.toFixed(2)}</span></button>`;
  }).join('');
  const ids = Object.keys(E.MENU);
  const cats = Object.keys(E.CAT_KO).map(cat => `<div class="card"><h3>${esc(E.CAT_KO[cat])}</h3><div class="stack tight">${ids.filter(i => E.MENU[i].cat === cat).map(i => menuRow(G, i)).join('')}</div></div>`).join('');
  const n = Object.keys(G.menu).length, fry = E.needsFryer(G), est = G.loc ? E.estimate(G) : null;
  let cx = 0; Object.keys(G.menu).forEach(i => { cx += E.MENU[i].cx; });
  const summary = `<div class="card flat"><h3>메뉴판 요약</h3><div class="stack tight">
    <div class="spread"><span>메뉴 ${n}개</span><span>월 고정비 <b class="num">+${won(n * MENU_ADD_FIXED)}</b></span></div>
    <div class="spread"><span>조리 복잡도 <span class="num">${cx.toFixed(1)}</span></span><span>${est ? `주방 속도 <b class="num ${est.kitchenSlow > 0.08 ? 'warn' : ''}">−${Math.round(est.kitchenSlow * 100)}%</b>` : '<span class="muted small">입지 선택 후 계산</span>'}</span></div>
    ${fry ? `<div class="spread"><span>튀김기 필요</span><span class="num">+${won(E.FRYER_COST)} · 월 12만원</span></div>` : ''}
    ${n > 7 ? '<div class="hint warn">메뉴가 7개를 넘어 맛 점수가 떨어집니다.</div>' : ''}
  </div></div>`;
  return `<div class="stack">
    ${head('메뉴 정하기')}
    <div class="stack tight"><h3>재료 등급</h3><div class="opts">${grades}</div></div>
    
    <div class="row small muted">좋아하는 손님: ${segLegend()}</div>
    ${cats}
    ${summary}
  </div>`;
}

/* ───────── 5단계: 직원·운영 ───────── */
function dots5(n) { let s = ''; for (let i = 1; i <= 5; i++) s += `<i class="${i <= n ? 'on' : ''}"></i>`; return `<span class="su-skill" role="img" aria-label="숙련도 5점 만점에 ${n}점">${s}</span>`; }
function staffCard(w, hired) {
  return `<div class="card flat su-staff">
    <div class="su-staff-h">${UI.faceBtn ? UI.faceBtn(w, 52) : ''}<div class="grow stack tight">
    <div class="spread"><b>${esc(w.name)}</b><span class="row" style="gap:6px"><span class="tag ${w.role === 'kitchen' ? 'info' : 'accent'}">${w.role === 'kitchen' ? '주방' : '홀'}</span><span class="tag">${w.full ? '풀타임' : '파트타임'}</span></span></div>
    <div class="row small"><span class="muted">숙련도</span>${dots5(w.skill)}<span class="muted">희망 월급</span><b class="num">${won(w.wage)}</b></div>
    <div class="small">${esc(w.bio)}</div></div></div>
    <div class="spread"><span class="small">면접 인상 <span class="tag ${w.hint === '성실해 보임' ? 'good' : w.hint === '오래 못 버틸 듯' ? 'warn' : ''}">${esc(w.hint)}</span></span>
      ${hired ? `<button class="btn sm" data-act="suUnhire" data-arg="${esc(w.id)}">채용 취소</button>` : `<button class="btn sm primary" data-act="suHire" data-arg="${esc(w.id)}">채용</button>`}</div>
  </div>`;
}
function stepStaff(G) {
  const est = G.loc ? E.estimate(G) : null;
  const role = [['kitchen', '주방에서 김밥을 만다', '홀 직원이 필요합니다.'], ['hall', '홀에서 손님을 받는다', '주방 직원이 필요합니다.']]
    .map(r => `<button class="opt ${G.ops.ownerRole === r[0] ? 'sel' : ''}" data-act="suRole" data-arg="${r[0]}" aria-pressed="${G.ops.ownerRole === r[0]}"><span class="t">${r[1]}</span><span class="d">${r[2]}</span></button>`).join('');
  const hours = Object.keys(E.HOURS).map(k => `<button class="opt ${G.ops.hours === k ? 'sel' : ''}" data-act="suHours" data-arg="${k}" aria-pressed="${G.ops.hours === k}"><span class="t">${esc(E.HOURS[k].name)}</span><span class="d">${esc(E.HOURS[k].desc)}</span></button>`).join('');
  return `<div class="stack">
    ${head('직원과 운영')}
    <div class="stack tight"><h3>사장님의 역할</h3><div class="opts">${role}</div>
      </div>
    <div class="stack tight"><h3>영업시간</h3><div class="opts">${hours}</div></div>
    <div class="card stack tight"><label class="switch"><input type="checkbox" id="su-dayoff" data-change="suDayOff" ${G.ops.dayOff ? 'checked' : ''}> 일요일 휴무</label>
      </div>
    <div class="stack tight"><h3>채용한 직원 <span class="muted small">${G.staff.length}명</span></h3>
      ${G.staff.length ? `<div class="su-cards">${G.staff.map(w => staffCard(w, true)).join('')}</div>` : '<div class="card flat sub small">채용한 직원이 없습니다.</div>'}</div>
    <div class="stack tight"><h3>지원자 <span class="muted small">${G.candidates.length}명</span></h3>
      ${G.candidates.length ? `<div class="su-cards">${G.candidates.map(w => staffCard(w, false)).join('')}</div>` : '<div class="card flat sub small">남은 지원자가 없습니다.</div>'}</div>
    
    <div class="card flat"><h3>운영 요약</h3>${est ? `<div class="stack tight">
      <div class="spread"><span>월 인건비</span><b class="num">${won(est.labor)}</b></div>
      <div class="spread"><span>점심 피크 처리 능력</span><b class="num">약 ${UI.int(est.lunchCap)}명</b></div>
      <div class="spread"><span>점심 좌석 수용</span><b class="num">약 ${UI.int(est.seatCap)}명</b></div>
      </div>` : '<p class="sub small">입지를 먼저 고르세요.</p>'}</div>
  </div>`;
}

/* ───────── 6단계: 최종 확인 ───────── */
function stepFinal(G) {
  const c = E.setupCost(G), est = E.estimate(G), L = G.loc ? E.LOC_BY[G.loc.id] : null;
  const loans = ['policy', 'bank', 'second'].filter(k => G.setupLoans[k] > 0).map(k => `${E.LOANS[k].name} ${won(G.setupLoans[k])}`).join(', ') || '없음';
  const menuN = Object.keys(G.menu).length;
  const row = (k, v) => `<div class="su-sumrow"><span class="k">${k}</span><span>${v}</span></div>`;
  const summary = `<div class="card"><h3>내가 고른 것</h3><div class="stack tight">
    ${row('입지', L ? `${L.no}번 ${esc(L.name)} · ${L.size}평 · 월세+관리비 ${won(L.rent + L.mgmt)}` : '<b class="neg">아직 고르지 않았습니다</b>')}
    ${row('인테리어·설비', `${esc(E.INTERIOR[G.interior].name)}, ${esc(E.EQUIP[G.equip].name)}`)}
    ${row('테이블', `${G.tables}세트`)}
    ${row('메뉴', `${menuN}개 · ${esc(E.GRADE[G.grade].name)}`)}
    ${row('직원', G.staff.length ? G.staff.map(w => `${esc(w.name)}(${w.role === 'kitchen' ? '주방' : '홀'})`).join(', ') : '없음 (사장 혼자)')}
    ${row('운영', `사장은 ${G.ops.ownerRole === 'kitchen' ? '주방' : '홀'}, ${esc(E.HOURS[G.ops.hours].name)}${G.ops.dayOff ? ', 일요일 휴무' : ''}`)}
    ${row('대출', esc(loans))}
    ${row('개업 준비', `${G.training ? '조리 교육 ' : ''}${G.openEvent ? '오픈 이벤트' : ''}${!G.training && !G.openEvent ? '없음' : ''}`)}
  </div></div>`;
  let reality;
  if (!est) reality = `<div class="hint bad">입지를 고르지 않아 손익분기를 계산할 수 없습니다.</div>`;
  else {
    const warns = [];
    if (est.bepCust > est.lunchCap * 3) warns.push(`하루 ${UI.int(est.bepCust)}명은 점심 피크 처리 능력(약 ${UI.int(est.lunchCap)}명)의 3배가 넘습니다. 직원·설비 보강이 필요합니다.`);
    const pop = totalPop(L);
    if (est.bepCust > pop * 0.25) warns.push(`이 상권의 하루 손님 후보(약 ${UI.int(pop)}명) 중 ${Math.round(est.bepCust / pop * 100)}%를 단골로 잡아야 합니다.`);
    if (est.seatCap < est.lunchCap * 0.5 && G.tables < E.maxTables(G)) warns.push('좌석이 부족해 점심 손님을 놓칠 수 있습니다.');
    reality = `<div class="receipt su-reality">
      <h3>현실 점검</h3>
      <div class="r"><span>임대료 (월세+관리비)</span>${num(won(est.rent))}</div>
      <div class="r"><span>인건비 (4대보험 포함)</span>${num(won(est.labor))}</div>
      <div class="r"><span>기타 고정비 <span class="note">메뉴 관리비·소모품${est.marketing ? '·마케팅' : ''}</span></span>${num(won(est.misc + est.marketing))}</div>
      <div class="r"><span>공과금 기본료</span>${num(won(est.util))}</div>
      <div class="r sum"><span>월 고정비</span>${num(won(est.fixed))}</div>
      <div class="r"><span>가게 손익분기 월매출</span><b class="num">${won(est.bepShop)}</b></div>
      
      <hr>
      <div class="r"><span>대출 상환 (월)</span>${num(won(est.loanPay))}</div>
      <div class="r"><span>생활비 (월)</span>${num(won(est.living))}</div>
      <div class="r sum"><span>대출 상환과 생활비 ${won(est.living)}까지 벌려면 월매출</span><b class="num">${won(est.bepAll)}</b></div>

      <div class="tile"><div class="k">매출</div><div class="v">${won(R.rev)}</div><div class="s">${R.revDel > 0 ? '매장 ' + won(R.revStore) + ' · 배달 ' + won(R.revDel) : '영업일 ' + R.openDays + '일'}</div></div>
      <div class="tile"><div class="k">영업이익</div><div class="v ${UI.wonCls(R.op)}">${UI.signed(R.op)}</div><div class="s">${R.rev > 0 ? '매출의 ' + pct(R.op / R.rev) : '매출 없음'}</div></div>
      <div class="tile"><div class="k">통장 증감</div><div class="v ${UI.wonCls(R.cashDelta)}">${UI.signed(R.cashDelta)}</div><div class="s">잔액 ${won(R.cash)}</div></div>

}

function funnelRow(label, v, base, cls) {
  const w = base > 0 ? Math.max(v > 0 ? 3 : 0, Math.min(100, v / base * 100)) : 0;
  return `<div class="rn-fr"><span class="rn-fl">${label}</span><span class="rn-fb ${cls}"><i style="width:${w.toFixed(1)}%"></i></span><span class="num rn-fn">${int(v)}명</span></div>`;
}
function funnelCard(R) {

function receiptCard(R) {
  const rev = R.rev;
  const share = v => (rev > 0 ? `<em class="rn-sh">${pct(Math.abs(v) / rev)}</em>` : '<em class="rn-sh"></em>');
  const cost = (label, v, note) => (v ? `<div class="r"><span>${label}${note ? `<span class="note">${esc(note)}</span>` : ''}</span><span class="rn-rv">${share(v)}<span class="num">${won(-v)}</span></span></div>` : '');
  const line = (label, html, cls) => `<div class="r ${cls || ''}"><span>${label}</span><span class="rn-rv">${html}</span></div>`;
  return `<section class="card"><h3>번 돈이 어디로 갔는가</h3>
    <div class="receipt rn-rcpt">
      ${line('매출', `${share(rev)}<span class="num b">${won(rev)}</span>`)}
      ${R.revDel > 0 ? `<div class="r rn-subr"><span>└ 매장</span><span class="rn-rv"><span class="num">${won(R.revStore)}</span></span></div><div class="r rn-subr"><span>└ 배달</span><span class="rn-rv"><span class="num">${won(R.revDel)}</span></span></div>` : ''}
      ${cost('재료비', R.cogs)}${cost('버린 재료', R.waste)}${cost('인건비', R.labor)}${cost('임대료·관리비', R.rent)}${cost('공과금', R.util)}
      ${cost('카드수수료·포장재', R.fees)}${cost('배달 수수료', R.delFees)}${cost('기타 고정비', R.misc)}${cost('홍보비', R.marketing)}${cost(R.oneoff < 0 ? '지원금' : '일회성 지출', R.oneoff)}
      ${line('영업이익', `${rev > 0 ? `<em class="rn-sh">${pct(R.op / rev)}</em>` : share(0)}<span class="num ${UI.wonCls(R.op)}">${UI.signed(R.op)}</span>`, 'sum')}
      ${cost('대출 이자', R.interest)}${cost('세금', R.tax, R.taxNote)}
      ${line('순이익', `<span class="num ${UI.wonCls(R.net)}">${UI.signed(R.net)}</span>`, 'sum')}
      ${cost('대출 원금 상환', R.principal)}${cost('생활비', R.living)}
      ${R.fin ? line(R.fin > 0 ? '새로 빌린 돈' : '갚은 돈', `<span class="num ${UI.wonCls(R.fin)}">${UI.signed(R.fin)}</span>`) : ''}
      ${line('통장 증감', `<span class="num ${UI.wonCls(R.cashDelta)}">${UI.signed(R.cashDelta)}</span>`, 'total')}
      ${line('통장 잔액', `<span class="num">${won(R.cash)}</span>`)}
    </div></section>`;
}

function mixCard(G, R) {
  const segs = SEG_ORDER.map(s => ({ s, cust: (R.seg && R.seg[s] ? R.seg[s].cust : 0) }));
  const tot = sum(segs, x => x.cust);
  const bar = tot > 0 ? `<div class="rn-stack" role="img" aria-label="손님 구성">${segs.filter(x => x.cust > 0).map(x => `<span style="width:${(x.cust / tot * 100).toFixed(2)}%;background:var(--seg-${x.s})"></span>`).join('')}</div>` : '<div class="muted small">이번 달 매장 손님이 없습니다.</div>';
  const legend = `<div class="rn-legend">${segs.map(x => `<span><i class="dot ${x.s}"></i>${E.SEG_KO[x.s]} <span class="num">${int(x.cust)}명</span>${tot > 0 ? ` <span class="muted tiny">${pct(x.cust / tot)}</span>` : ''}</span>`).join('')}</div>`;
  const items = Object.keys(R.items || {}).map(id => ({ id, qty: R.items[id].qty, rev: R.items[id].rev })).sort((a, b) => b.rev - a.rev);
  const itot = sum(items, x => x.rev);
  const rows = items.map(x => `<tr><td>${UI.MENU_ICON[x.id] || ''} ${esc(E.MENU[x.id] ? E.MENU[x.id].name : x.id)}</td><td class="r num">${int(x.qty)}개</td><td class="r num">${won(x.rev)}</td><td class="r num">${per(x.rev, itot)}</td></tr>`).join('');
  return `<section class="card"><h3>손님 구성</h3>${bar}${legend}
    <h3 style="margin-top:16px">메뉴별 판매</h3>
    ${items.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>메뉴</th><th class="r">판매량</th><th class="r">매출</th><th class="r">비중</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted small">판매 기록이 없습니다.</p>'}</section>`;
}

/* 추이 차트 */
function chartCard(G) {
  const h = G.hist || [];
  if (!h.length) return `<section class="card"><h3>추이</h3><p class="muted small">첫 결산 뒤에 표시됩니다.</p></section>`;
  const W = 400, padL = 6, padR = 6, n = h.length, N = Math.max(n, 12), slot = (W - padL - padR) / N;
  const fmt = v => won(v);
  const seps = h.map((p, i) => (p.m > 1 && (p.m - 1) % 12 === 0 ? i : -1)).filter(i => i >= 0);
  const axis = (top, bot) => {
    const out = [`<text class="rn-ax" x="${padL}" y="${bot + 12}">1년차</text>`];
    seps.forEach(i => {
      const x = padL + i * slot;
      out.push(`<line class="rn-sep" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${top}" y2="${bot}"/>`);
      out.push(`<text class="rn-ax" x="${(x + 3).toFixed(1)}" y="${bot + 12}">${E.yearOf(h[i].m)}년차</text>`);
    });
    return out.join('');
  };
  // 1) 영업이익 막대
  const top1 = 14, bot1 = 104, H1 = 120;
  const ops = h.map(p => p.op), mx = Math.max(0, ...ops), mn = Math.min(0, ...ops), rg = (mx - mn) || 1;
  const y0 = top1 + (mx / rg) * (bot1 - top1);
  const bars = h.map((p, i) => {
    const x = padL + i * slot + slot * .15, w = Math.max(1, slot * .7);
    const hh = Math.abs(p.op) / rg * (bot1 - top1), y = p.op >= 0 ? y0 - hh : y0;
    return `<rect class="${p.op >= 0 ? 'rn-up' : 'rn-dn'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(p.op ? 1 : 0, hh).toFixed(1)}"/>`;
  }).join('');
  const svg1 = `<svg class="rn-svg" viewBox="0 0 ${W} ${H1}" role="img" aria-label="월별 영업이익 막대 그래프">
    ${axis(top1, bot1)}<line class="rn-zero" x1="${padL}" x2="${W - padR}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}"/>${bars}
    ${mx > 0 ? `<text class="rn-lb" x="${padL + 2}" y="10">최고 ${esc(UI.signed(mx))}</text>` : ''}
    ${mn < 0 ? `<text class="rn-lb" x="${padL + 2}" y="${bot1 - 2}">최저 ${esc(fmt(mn))}</text>` : ''}</svg>`;
  // 2) 통장 잔액 선
  const top2 = 14, bot2 = 84, H2 = 100;
  const cs = h.map(p => p.cash), cmx = Math.max(...cs), cmn = Math.min(0, ...cs), crg = (cmx - cmn) || 1;
  const X = i => padL + i * slot + slot / 2, Y = v => top2 + (1 - (v - cmn) / crg) * (bot2 - top2);
  const pts = cs.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const area = n > 1 ? `<polygon class="rn-area" points="${X(0).toFixed(1)},${Y(cmn).toFixed(1)} ${pts.join(' ')} ${X(n - 1).toFixed(1)},${Y(cmn).toFixed(1)}"/>` : '';
  const last = cs[n - 1], imin = cs.indexOf(Math.min(...cs));
  const svg2 = `<svg class="rn-svg" viewBox="0 0 ${W} ${H2}" role="img" aria-label="통장 잔액 선 그래프">
    ${axis(top2, bot2)}${cmn < 0 ? `<line class="rn-zero" x1="${padL}" x2="${W - padR}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>` : ''}${area}
    <polyline class="rn-line" points="${pts.join(' ')}"/><circle class="rn-pt" cx="${X(n - 1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3"/>
    <text class="rn-lb" x="${padL + 2}" y="10">최고 ${esc(fmt(cmx))}</text>
    ${n > 1 ? `<text class="rn-lb" x="${(X(imin) > W / 2 ? X(imin) - 4 : X(imin) + 4).toFixed(1)}" y="${Math.min(bot2 - 2, Y(cs[imin]) + 12).toFixed(1)}" text-anchor="${X(imin) > W / 2 ? 'end' : 'start'}">최저 ${esc(fmt(cs[imin]))}</text>` : ''}</svg>`;
  return `<section class="card"><h3>추이</h3>
    <div class="rn-ch"><h4>월별 영업이익 (막대)</h4>${svg1}</div>
    <div class="rn-ch"><h4>통장 잔액 (선) — 지금 ${esc(fmt(last))}</h4>${svg2}</div></section>`;
}

function logCard(G) {
  const rows = (G.log || []).slice(-15).reverse();

}

/* ───────── 오른쪽: 관리 탭 ───────── */
function tabMenu(G) {

      <td class="r num ${rate > .45 ? 'warn' : ''}">${pct(rate)}</td><td class="r num">${sold}</td>

    <div class="card"><h3>재료 등급</h3><div class="opts">${Object.keys(E.GRADE).map(g => `<button type="button" class="opt ${G.grade === g ? 'sel' : ''}" id="rn-gr-${g}" data-act="rnGrade" data-arg="${g}"><span class="t">${E.GRADE[g].name}</span><span class="d">${E.GRADE[g].desc}</span></button>`).join('')}</div></div>
    <div class="card"><h3>현재 메뉴 ${ids.length}개</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>메뉴</th><th>판매가 (100원씩)</th><th class="r">원가율</th><th class="r">지난달</th><th>레시피</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      ${est ? `<p class="tiny muted" style="margin-top:8px">메뉴 1개당 월 7만원 · 주방 속도 −${pct(est.kitchenSlow)}</p>` : ''}</div>

function tabFin(G) {
  const est = E.estimate(G), debt = debtOf(G), M5 = 500 * MAN;
  const fixedAll = est ? est.fixed + est.loanPay + est.living : 0;
  const loans = G.loans.map((l, i) => {
    const part = Math.min(M5, Math.ceil(l.principal)), full = Math.ceil(l.principal);
    return `<tr><td>${esc(l.name)}</td><td class="r num">${won(l.principal)}</td><td class="r num">${pct(l.rate, 1)}</td><td class="r num">${l.pay ? won(l.pay) : '-'}</td><td class="r num">${l.left ? l.left + '개월' : '-'}</td>
      <td class="nowrap"><button type="button" class="btn sm" id="rn-rp-${i}" data-act="rnRepay" data-arg="${i}|part" ${G.cash < part ? 'disabled' : ''}>${won(part)} 갚기</button> <button type="button" class="btn sm" id="rn-rf-${i}" data-act="rnRepay" data-arg="${i}|full" ${G.cash < full ? 'disabled' : ''}>전액 갚기</button></td></tr>`;
  }).join('');
  const borrow = ['bank', 'second', 'family'].map(k => {
    const d = E.LOANS[k], rate = d.rate + (k === 'family' ? 0 : G.idx.rate), left = G.credit[k], amt = Math.min(M5, left);
    return `<div class="rn-add"><div class="grow"><b>${d.name}</b> <span class="tag">${rate > 0 ? '연 ' + pct(rate, 1) : '무이자'}</span><div class="tiny muted">남은 한도 ${won(left)} · ${d.desc}</div></div>
      <button type="button" class="btn sm" id="rn-bw-${k}" data-act="rnBorrow" data-arg="${k}" ${left <= 0 ? 'disabled' : ''}>+${won(amt)} 빌리기</button></div>`;
  }).join('');
  return `<div class="stack">
    <div class="card"><h3>통장 잔액 ${won(G.cash)}</h3>
      ${est ? `<div class="rn-kvs">${kv('월 고정비', won(est.fixed))}${kv('대출 상환', won(est.loanPay))}${kv('생활비', won(est.living))}</div>
      <p class="small sub" style="margin-top:8px">매달 고정 지출 <b>${won(fixedAll)}</b> · 본전 월매출 <b>${won(est.bepAll)}</b></p>` : ''}</div>
    <div class="card"><h3>갚을 돈 ${won(debt)}</h3>${G.loans.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>대출</th><th class="r">잔액</th><th class="r">금리</th><th class="r">월 상환</th><th class="r">남은 기간</th><th></th></tr></thead><tbody>${loans}</tbody></table></div>` : '<p class="muted small">갚을 대출이 없습니다.</p>'}</div>
    ${(G.subs || []).length ? `<div class="card"><h3>약정</h3>${G.subs.map(x => `<div class="rn-kv"><span>${esc(x.name)} <span class="tiny muted">${Math.max(0, x.until - G.month)}개월 남음</span></span><span class="num">월 ${won(x.amt)}</span></div>`).join('')}</div>` : ''}

}

UI.views.run = {
  render() {
    const G = UI.G;
    if (!G || !G.loc) return `<div class="wrap"><div class="card">진행 중인 게임이 없습니다.</div></div>`;
    if (clock.forG !== G) {   // 새 게임이거나 저장본을 불러온 직후: 시계를 멈춘 상태로 되돌린다
      if (clock.timer) clearTimeout(clock.timer);
      Object.assign(clock, { forG: G, timer: null, busy: false, R: null, prevR: null, day: 0, evQ: [], cashOff: 0, snap: null, endCash: 0, feed: [], beat: 0 });
      UI.state.rnPlay = false;
    }
    return withView(G, () => {
      const R = G.last;
      const left = [sceneCard(), liveCard(G)];
      if (!R) left.push(openingCard(G));
      else left.push(reportCard(G, R), funnelCard(R), receiptCard(R), mixCard(G, R));
      if (UI.guestsCard) left.push(UI.guestsCard(G));
      left.push(chartCard(G), logCard(G));
      return topStrip(G) + `<div class="wrap rn-wrap"><div class="grid2"><div class="stack">${left.join('')}</div>${rightColumn(G)}</div></div>` + actionBar(G);
    });
  },
  mount() { syncScene(); if (UI.state.rnPlay && !clock.timer && !clock.busy) kick(); }
};

  if (!ok) return false;

};

/* ───────── 시간 진행 ───────── */
const TONE_ICON = { good: '✅', bad: '⚠️', neutral: 'ℹ️' };
/* 가게를 멈춰 세울 만한 일만 창으로 띄운다. 나머지는 '오늘' 카드의 소식으로 지나간다 */
const BIG = /이혼|파산|쓰러짐|과로|건강 악화|식중독|영업정지|대유행|전면 해제|긴급 대출|손을 벌림|퇴사|신규 개업|재계약|잔고 부족|떠났습니다|들켜/;
const isBig = e => !!e.big || BIG.test(e.title);
const whoOf = x => (x && x.who && UI.whoHTML ? (UI.whoHTML(UI.G, x.who) || '') : '');
function eventsBody(events) {
  return `<div class="rn-evs">${events.map(e => `<div class="rn-ev"><span class="rn-evi">${TONE_ICON[e.tone] || TONE_ICON.neutral}</span><div><b>${esc(e.title)}</b><div class="small sub">${esc(e.text)}</div></div></div>`).join('')}</div>`;
}

/* 선택이 필요한 사건 하나를 물어보고 결과를 알려 준다 */
async function askChoice(p, kicker) {
  const G = UI.G, at = G.pending.indexOf(p);
  if (at < 0) return;
  const who = whoOf(p);
  const i = await UI.modal({ kicker: '결정이 필요합니다', title: p.title, body: `${who}<p>${esc(p.text)}</p>`, tone: p.tone === 'bad' ? 'bad' : '', buttons: p.choices.map(c => ({ label: c.t, desc: c.d })), dismiss: false, auto: p.def || 0 });
  const idx = G.pending.indexOf(p); if (idx < 0) return;
  const msg = E.resolve(G, idx, i >= 0 ? i : (p.def || 0));
  const ch = i >= 0 ? i : (p.def || 0), cat = E.ext && E.ext.EV[p.id] && E.ext.EV[p.id].cat;
  if (msg && cat === 'tempt' && ch === (p.def || 0) && clock.R) { clock.feed.push({ day: clock.day, tone: 'neutral', title: p.title, text: msg }); clock.beat = Math.max(clock.beat, 600); updateLive(); return; }
  if (msg) await UI.modal({ kicker, title: p.title, body: `${who}<p>${esc(msg)}</p>`, tone: p.tone === 'bad' ? 'bad' : '', buttons: [{ label: '확인', cls: 'primary' }] });
}

/* 사건이 달의 며칠에 드러날지 정한다(표시용). 월초에 정해지는 일은 1~2일, 돈이 바닥나는 일은 말일 */
function dayFor(title, id, i) {
  if (id === 'lease') return 1;
  if (id === 'offer') return 30;
  if (/퇴사|최저임금|재계약|가격 인상|가격 인하|입주/.test(title)) return 1 + (i % 2);
  if (/긴급 대출|손을 벌림|파산|쓰러짐|과로|건강 악화/.test(title)) return 30;
  return 3 + Math.floor(Math.random() * 25);
}

/* 새 달을 시작한다: 엔진으로 한 달을 계산해 두고 0일부터 재생 준비 */
async function beginMonth() {
  const G = UI.G;
  if (!G || G.phase !== 'run') return false;
  while (G.pending.length && G.phase === 'run') await askChoice(G.pending[0], UI.calLabel(G.month));   // 저장본에 남아 있던 결정
  if (G.phase !== 'run') { UI.go('end'); return false; }
  const prevR = G.last, before = G.cash, snap = { rep: G.rep, aware: G.aware, stamina: G.stamina, clean: G.clean };
  const R = E.runMonth(G);
  if (!R) return false;
  Object.assign(clock, { R, prevR, day: 0, cashOff: G.cash - before, evQ: [], snap, endCash: G.cash, feed: [], beat: 0 });
  (R.news || []).forEach((e, i) => clock.evQ.push({ day: 1 + i, e: { tone: 'news', title: e.title, text: e.text } }));
  const fin = (R.flow || []).find(x => x.k === 'fin');
  (R.events || []).forEach((e, i) => {
    const md = /^(d+)일에/.exec(e.text || '');
    const day = /잔고 부족/.test(e.title) && md ? +md[1] : fin && /긴급 대출|손을 벌림/.test(e.title) ? fin.day : dayFor(e.title, '', i);
    clock.evQ.push({ day, e });
  });
  (G.pending || []).forEach((p, i) => clock.evQ.push({ day: dayFor(p.title, p.id, i), p }));
  UI.render();   // 지원자 목록 등 월초에 바뀌는 것 반영
  return true;
}

/* 하루를 보낸다. 그날 드러나는 사건을 보여 주고, 30일이면 결산한다 */
async function dayStep() {
  const R = clock.R; if (!R) return;
  clock.day++;
  const due = clock.evQ.filter(x => x.day === clock.day);
  if ((R.flow || []).some(x => x.day === clock.day)) clock.beat = Math.max(clock.beat, 300);   // 돈이 빠지는 날은 잠깐 숨을 고른다
  updateLive();
  if (due.length) {
    clock.evQ = clock.evQ.filter(x => x.day !== clock.day);
    const kicker = `${UI.calLabel(R.m)} ${clock.day}일`;
    const all = due.filter(x => x.e).map(x => x.e), notes = all.filter(isBig), small = all.filter(e => !isBig(e));
    if (small.length) {
      small.forEach(e => clock.feed.push({ day: clock.day, tone: e.tone, title: e.title, text: e.text }));
      clock.beat = Math.max(clock.beat, 900); updateLive();
    }
    if (notes.length) {
      const bad = notes.some(e => e.tone === 'bad');
      await UI.modal({ kicker, title: notes.length === 1 ? notes[0].title : '오늘 있었던 일', body: notes.length === 1 ? `${whoOf(notes[0])}<p>${esc(notes[0].text)}</p>` : eventsBody(notes), tone: bad ? 'bad' : (notes.every(e => e.tone === 'good') ? 'good' : ''), buttons: [{ label: '확인', cls: 'primary' }] });
    }
    for (const x of due) if (x.p) await askChoice(x.p, kicker);
  }
  if (clock.day >= 30) endMonth();
}

function endMonth() {
  const G = UI.G;
  Object.assign(clock, { R: null, prevR: null, day: 0, evQ: [], cashOff: 0, snap: null, endCash: 0, feed: [], beat: 0 });
  if (G.phase === 'end') { UI.state.rnPlay = false; UI.go('end'); return; }
  if (UI.state.rnMonthStop) UI.state.rnPlay = false;
  UI.save(); UI.render();
}

/* 시계 */
function kick() {
  if (!UI.hasDOM) return;
  if (clock.timer) clearTimeout(clock.timer);
  const ms = SPEED_MS[UI.state.rnSpeed] || SPEED_MS[1], beat = clock.beat * Math.min(1, ms / 500); clock.beat = 0;   // 빠른 배속에서는 숨 고르기도 짧게
  clock.timer = setTimeout(tick, ms + beat);
}
async function tick() {
  clock.timer = null;
  const G = UI.G;
  if (!G || UI.state.view !== 'run' || !UI.state.rnPlay) return;
  if (clock.busy || document.querySelector('.modal-back')) { kick(); return; }   // 다른 창이 떠 있으면 기다린다
  clock.busy = true;
  try { if (!clock.R) await beginMonth(); else await dayStep(); }
  catch (e) { console.error(e); }
  finally { clock.busy = false; }
  if (UI.G === G && UI.state.view === 'run' && UI.state.rnPlay) kick();
}

A.rnPlay = () => {
  const st = UI.state; st.rnPlay = !st.rnPlay;
  if (st.rnPlay) kick(); else if (clock.timer) { clearTimeout(clock.timer); clock.timer = null; }
};
A.rnSpeed = x => { UI.state.rnSpeed = SPEED_MS[+x] ? +x : 1; if (UI.state.rnPlay) kick(); };
A.rnMonthStop = v => { UI.state.rnMonthStop = !!v; };
A.rnScene = () => { UI.state.rnScene = !UI.state.rnScene; };
/* 이번 달 건너뛰기: 남은 날을 한 번에 보낸다(사건 창은 그대로 뜬다) */
A.rnNext = async () => {
  if (clock.busy) return false;
  clock.busy = true;
  try { if (clock.R || await beginMonth()) while (clock.R) await dayStep(); }
  finally { clock.busy = false; }
  if (UI.hasDOM && UI.state.view === 'run' && UI.state.rnPlay) kick();
};
A.rnNext3 = async () => { for (let k = 0; k < 3 && UI.G && UI.G.phase === 'run'; k++) await A.rnNext(); };

if (UI.hasDOM) {
  document.addEventListener('keydown', ev => {   // 스페이스바로 멈춤/계속
    if (ev.code !== 'Space' || UI.state.view !== 'run' || ev.repeat) return;
    const t = ev.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || document.querySelector('.modal-back')) return;
    ev.preventDefault(); UI.act('rnPlay');
  });
}
})();

;UI.start();
</script>
</body></html>
