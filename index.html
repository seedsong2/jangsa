<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>장사의 신</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 장사의 신 — 공통 스타일
   레이아웃 개념: 포스기 같은 상단 상태줄 + 영수증형 결산서 + 분식집 메뉴판 같은 관리 패널 */
:root {
  --bg: #EDF0EA; --surface: #FBFCF9; --surface2: #F2F5EE; --ink: #16221B; --ink2: #4B5A51; --ink3: #76857A;
  --line: #D3DACF; --line2: #E4E9E0;
  --accent: #F2C200; --accent-ink: #1A1600; --accent-soft: #FFF2B8;   /* 단무지 */
  --kim: #1C2A22; --kim-ink: #F4F7F1;                                  /* 김 */
  --good: #17804A; --good-soft: #DDF2E4; --bad: #C9341F; --bad-soft: #FBE3DE;
  --warn: #A86400; --warn-soft: #FCEFD2; --info: #2A6FB0; --info-soft: #E0ECF8;
  --seg-office: #3B6FB5; --seg-student: #D9822B; --seg-resident: #2E9A6B; --seg-transit: #8A5BB8;
  --shadow: 0 1px 2px rgba(22, 34, 27, .06), 0 8px 24px rgba(22, 34, 27, .07);
  --scrim: rgba(16, 24, 19, .55);
  --font-display: 'Black Han Sans', 'Do Hyeon', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --font-num: 'IBM Plex Mono', 'Consolas', 'Menlo', 'Malgun Gothic', monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1712; --surface: #17221B; --surface2: #1E2B23; --ink: #E8EFE7; --ink2: #B6C3B8; --ink3: #8A998E;
    --line: #2F3F34; --line2: #25332A;
    --accent: #F2C200; --accent-ink: #1A1600; --accent-soft: #3A3208;
    --kim: #0A100C; --kim-ink: #E8EFE7;
    --good: #4CC784; --good-soft: #153224; --bad: #FF7A66; --bad-soft: #3B1A15;
    --warn: #F0B14A; --warn-soft: #3A2B10; --info: #7DB3EA; --info-soft: #15283B;
    --seg-office: #6FA0E0; --seg-student: #F0A55A; --seg-resident: #5CC596; --seg-transit: #B48AE0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    --scrim: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1712; --surface: #17221B; --surface2: #1E2B23; --ink: #E8EFE7; --ink2: #B6C3B8; --ink3: #8A998E;
  --line: #2F3F34; --line2: #25332A;
  --accent: #F2C200; --accent-ink: #1A1600; --accent-soft: #3A3208;
  --kim: #0A100C; --kim-ink: #E8EFE7;
  --good: #4CC784; --good-soft: #153224; --bad: #FF7A66; --bad-soft: #3B1A15;
  --warn: #F0B14A; --warn-soft: #3A2B10; --info: #7DB3EA; --info-soft: #15283B;
  --seg-office: #6FA0E0; --seg-student: #F0A55A; --seg-resident: #5CC596; --seg-transit: #B48AE0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  --scrim: rgba(0, 0, 0, .65);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 400; letter-spacing: .01em; text-wrap: balance; line-height: 1.15; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.05rem; font-weight: 700; }
h4 { font-size: .8rem; font-weight: 600; color: var(--ink3); letter-spacing: .04em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ── 레이아웃 ── */
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stack.tight { gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0; }
.spread { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid-side { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid2, .grid-side { grid-template-columns: minmax(0, 1fr); } }
.grow { flex: 1 1 0; min-width: 0; }

/* ── 글자 ── */
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.big { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.1; }
.pos { color: var(--good); } .neg { color: var(--bad); } .warn { color: var(--warn); }
.muted { color: var(--ink3); } .small { font-size: .84rem; } .tiny { font-size: .76rem; }
.b { font-weight: 700; }
.right { text-align: right; } .center { text-align: center; }
.nowrap { white-space: nowrap; }

/* ── 카드 ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { background: var(--surface2); border-color: var(--line2); }
.card > h3 { margin-bottom: 10px; }
.sub { color: var(--ink2); font-size: .9rem; }

/* ── 버튼 ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; line-height: 1.2; transition: transform .06s, background .12s, border-color .12s; text-decoration: none; }
.btn:hover { border-color: var(--ink3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.dark { background: var(--kim); border-color: var(--kim); color: var(--kim-ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
.btn.ghost:hover { background: var(--surface2); }
.btn.sm { padding: 5px 10px; font-size: .84rem; border-radius: 6px; }
.btn.lg { padding: 13px 26px; font-size: 1.05rem; }
.btn.block { width: 100%; }
.btn[disabled], .btn.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }

/* ── 꼬리표 ── */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .76rem; font-weight: 600; background: var(--surface2); color: var(--ink2); border: 1px solid var(--line2); white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.tag.accent { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); flex: none; }
.dot.office { background: var(--seg-office); } .dot.student { background: var(--seg-student); } .dot.resident { background: var(--seg-resident); } .dot.transit { background: var(--seg-transit); }

/* ── 숫자 타일 ── */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface2); border: 1px solid var(--line2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: .76rem; color: var(--ink3); font-weight: 600; }
.tile .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 600; white-space: nowrap; }
.tile .s { font-size: .74rem; color: var(--ink3); }

/* ── 막대 ── */
.bar { display: block; height: 8px; border-radius: 999px; background: var(--line2); overflow: hidden; min-width: 40px; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--ink2); transition: width .3s; }
.bar.accent > i { background: var(--accent); } .bar.good > i { background: var(--good); } .bar.bad > i { background: var(--bad); } .bar.warn > i { background: var(--warn); } .bar.info > i { background: var(--info); }
.bar.thick { height: 14px; }

/* ── 표 ── */
.tbl-wrap { overflow-x: auto; max-width: 100%; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-size: .76rem; font-weight: 600; color: var(--ink3); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl tr.me td { background: var(--accent-soft); }

/* ── 고르는 카드 ── */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.opt { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; min-width: 0; }
.opt:hover { border-color: var(--ink3); }
.opt.sel { border-color: var(--ink); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--ink); }
.opt .t { font-weight: 700; } .opt .d { font-size: .84rem; color: var(--ink2); } .opt .p { font-family: var(--font-num); font-size: .88rem; }

/* ── 증감 버튼 ── */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.stepper button { width: 30px; height: 30px; border: 0; background: var(--surface2); cursor: pointer; font-weight: 700; font-size: 1rem; line-height: 1; }
.stepper button:hover { background: var(--line2); }
.stepper .val { min-width: 76px; padding: 0 8px; text-align: center; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: .92rem; white-space: nowrap; }

/* ── 탭 ── */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--kim); padding-bottom: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; padding: 8px 13px; border: 0; background: transparent; border-radius: 8px 8px 0 0; font-weight: 600; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.tab:hover { background: var(--surface2); }
.tab.on { background: var(--kim); color: var(--kim-ink); }
.tab .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .7rem; line-height: 18px; text-align: center; }

/* ── 입력 ── */
.input, select.input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
input[type="range"] { width: 100%; accent-color: var(--kim); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--kim); }

/* ── 안내 상자 ── */
.hint { background: var(--info-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: .88rem; border-left: 0; }
.hint.warn { background: var(--warn-soft); } .hint.bad { background: var(--bad-soft); } .hint.good { background: var(--good-soft); }

/* ── 영수증 ── */
.receipt { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 16px 18px; font-size: .9rem; }
.receipt .r { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.receipt .r > span:first-child { min-width: 0; }
.receipt .r.sum { border-top: 1px dashed var(--ink3); margin-top: 6px; padding-top: 8px; font-weight: 700; }
.receipt .r.total { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; font-weight: 700; font-size: 1.02rem; }
.receipt .r .note { color: var(--ink3); font-size: .78rem; margin-left: 6px; }
.receipt hr { border: 0; border-top: 1px dashed var(--ink3); margin: 8px 0; }

/* ── 모달 ── */
.modal-back { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 100; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadeIn .12s; }
.modal { background: var(--surface); color: var(--ink); border-radius: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); width: min(460px, 100%); max-height: 100%; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: pop .14s; }
.modal.wide { width: min(720px, 100%); }
.modal h3 { font-size: 1.15rem; }
.modal .kicker { font-size: .76rem; font-weight: 700; letter-spacing: .06em; color: var(--ink3); }
.modal.bad .kicker { color: var(--bad); } .modal.good .kicker { color: var(--good); }
.modal-body { color: var(--ink2); }
.modal-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.modal-btns.choices { flex-direction: column; }
.choice { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 11px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.choice:hover { border-color: var(--ink); background: var(--accent-soft); }
.choice .t { font-weight: 700; color: var(--ink); } .choice .d { font-size: .84rem; color: var(--ink2); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }

/* ── 토스트 ── */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 120; pointer-events: none; width: min(92vw, 460px); }
.toast { background: var(--kim); color: var(--kim-ink); padding: 10px 14px; border-radius: 9px; font-size: .9rem; box-shadow: var(--shadow); animation: pop .15s; border: 1px solid var(--line); }
.toast.good { border-color: var(--good); } .toast.bad { border-color: var(--bad); }

/* ── 상표 ── */
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 1.3rem; line-height: 1; color: var(--ink); white-space: nowrap; }
.brand i { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, var(--accent) 0 22%, var(--surface) 23% 62%, var(--kim) 63% 100%); flex: none; border: 1px solid var(--kim); }

/* 장사의 신 — 타이틀·결과·도움말 스타일 (에이전트 D). 색은 base.css 토큰만 사용 */

/* ── 타이틀 ── */
.mt-top { margin-bottom: 18px; }
.mt-brand { font-size: 1.7rem; }
.mt-brand i { width: 30px; height: 30px; }
.mt-hero { align-items: stretch; }
.mt-head { display: flex; gap: 16px; align-items: flex-start; }
.mt-h1 { font-size: clamp(1.7rem, 5.5vw, 2.5rem); line-height: 1.2; }
.mt-start { display: flex; flex-direction: column; gap: 10px; }
.mt-start .input { width: 100%; font-size: 1rem; }

/* 김밥 단면 */
.mt-roll { position: relative; flex: none; width: 64px; height: 64px; margin-top: 6px; }
.mt-roll i { position: absolute; border-radius: 50%; }
.mt-roll .r1 { inset: 0; background: var(--kim); }
.mt-roll .r2 { inset: 7px; background: var(--surface); border: 1px solid var(--line); }
.mt-roll .f { width: 14px; height: 14px; }
.mt-roll .f1 { left: 25px; top: 13px; background: var(--accent); }
.mt-roll .f2 { left: 13px; top: 31px; background: var(--bad); }
.mt-roll .f3 { left: 36px; top: 31px; background: var(--good); }
.mt-roll .f4 { left: 25px; top: 38px; width: 10px; height: 10px; background: var(--warn); }
@media (max-width: 420px) { .mt-roll { display: none; } }

.mt-steps { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.mt-steps li { display: flex; gap: 12px; align-items: flex-start; }
.mt-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--kim); color: var(--kim-ink); display: inline-flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 600; margin-top: 1px; }
.mt-lbcard { margin-top: 16px; }

/* ── 리더보드 ── */
.mt-lb { display: flex; flex-direction: column; gap: 10px; }
.mt-lb h3 { margin: 0; }
.mt-lb-sum { margin: 0; }
.mt-tbl td, .mt-tbl th { white-space: nowrap; }
.mt-tbl .mt-nm { white-space: normal; min-width: 90px; }
.mt-tbl tr.mt-gap td { background: transparent; padding-block: 2px; }
.mt-empty { display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; padding: 26px 12px; border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface2); color: var(--ink2); }
.mt-empty b { color: var(--ink); }
.mt-mine { margin: 0; font-weight: 600; }

/* ── 결과 ── */
.mt-verdict { border-top: 5px solid var(--ink3); padding: 20px 18px; display: flex; flex-direction: column; gap: 4px; }
.mt-verdict.good { border-top-color: var(--good); }
.mt-verdict.bad { border-top-color: var(--bad); }
.mt-kicker { font-size: .82rem; font-weight: 700; letter-spacing: .06em; color: var(--ink3); }
.mt-tier { font-size: clamp(1.4rem, 5vw, 2rem); }
.mt-score { font-family: var(--font-display); font-size: clamp(2.6rem, 12vw, 4.6rem); line-height: 1.05; margin-top: 6px; white-space: normal; letter-spacing: 0; }
.mt-score.good { color: var(--good); }
.mt-score.bad { color: var(--bad); }
.mt-score-l { font-size: .84rem; font-weight: 600; color: var(--ink3); }
.mt-sentence { margin-top: 8px; font-size: 1.02rem; color: var(--ink); }
.mt-end h3 { margin-bottom: 0; }

.mt-wage { font-size: 1.02rem; }
.mt-flow { display: flex; flex-direction: column; gap: 9px; }
.mt-fr { display: grid; grid-template-columns: minmax(84px, 38%) minmax(0, 1fr) 72px; gap: 8px; align-items: center; font-size: .88rem; }
.mt-fl { min-width: 0; }
.mt-fv { text-align: right; font-size: .86rem; }
.mt-fr .bar { min-width: 0; }

.mt-obs { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.mt-tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.mt-tl li { padding-left: 10px; border-left: 3px solid var(--bad); }

.mt-chart { display: block; width: 100%; height: 150px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
.mt-chart .mt-neg { fill: var(--bad-soft); }
.mt-chart .mt-zero { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.mt-chart .mt-line { fill: none; stroke: var(--info); stroke-width: 2.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.mt-chart .mt-dot { fill: var(--info); stroke: var(--surface); stroke-width: 2; vector-effect: non-scaling-stroke; }

.mt-actions { margin-top: 4px; }

/* ── 도움말 ── */
.mt-help { display: flex; flex-direction: column; gap: 14px; color: var(--ink); font-size: .92rem; }
.mt-help section { display: flex; flex-direction: column; gap: 4px; }
.mt-help h4 { font-size: .86rem; color: var(--ink); padding-bottom: 3px; border-bottom: 2px solid var(--accent); align-self: flex-start; }
.mt-help p { margin: 0; color: var(--ink2); }
.mt-help ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 3px; color: var(--ink2); }
.mt-help b { color: var(--ink); }

/* 장사의 신 — 창업 준비 화면 스타일 (지도 전용 토큰 포함) */
:root {
  --map-ground: #E4EADF; --map-road: #FBFCF9; --map-road-line: #C9D1C3; --map-block: #CFD8CA; --map-block-line: #A9B6A4;
  --map-park: #BFDCB8; --map-zone: #D9E1D4; --map-label: #3A4A40; --map-site: #8A6A00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --map-ground: #121C16; --map-road: #2A3A30; --map-road-line: #46594C; --map-block: #25352B; --map-block-line: #3C5042;
    --map-park: #1F3D2A; --map-zone: #1A271F; --map-label: #C5D2C7; --map-site: #E3B92E;
  }
}
:root[data-theme="dark"] {
  --map-ground: #121C16; --map-road: #2A3A30; --map-road-line: #46594C; --map-block: #25352B; --map-block-line: #3C5042;
  --map-park: #1F3D2A; --map-zone: #1A271F; --map-label: #C5D2C7; --map-site: #E3B92E;
}

.su-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 16px; }
.su-title { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; margin: 0; }
.su-steps { flex: 1 1 100%; min-width: 0; }
.su-steps ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.su-step { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink2); font-weight: 600; font-size: .86rem; }
.su-step .su-no { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; background: var(--surface2); border: 1px solid var(--line); font-size: .78rem; font-family: var(--font-num); }
.su-step.done .su-no { background: var(--good-soft); color: var(--good); border-color: transparent; }
.su-step.cur { background: var(--kim); color: var(--kim-ink); border-color: var(--kim); }
.su-step.cur .su-no { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
@media (max-width: 600px) { .su-step:not(.cur) .su-lb { display: none; } .su-step:not(.cur) { padding-right: 6px; } }

.su-side { position: sticky; top: 12px; }
@media (max-width: 900px) { .su-side { position: static; } }
.su-receipt h3 { margin-bottom: 8px; }
.su-gap { margin-top: 10px; }
.su-nav { margin-top: 6px; }

.su-loan input[type="range"] { margin: 8px 0 4px; }

/* 지도 */
.su-mapcard { padding: 10px; }
.su-map { display: block; width: 100%; height: auto; border-radius: 6px; user-select: none; }
.su-map .ground { fill: var(--map-ground); }
.su-map .road { fill: var(--map-road); stroke: var(--map-road-line); stroke-width: 1; }
.su-map .lane { stroke: var(--map-road-line); stroke-width: 1.5; stroke-dasharray: 10 10; }
.su-map .blk { fill: var(--map-block); stroke: var(--map-block-line); stroke-width: 1; }
.su-map .zone { fill: var(--map-zone); stroke: var(--map-block-line); stroke-width: 1; }
.su-map .park { fill: var(--map-park); stroke: var(--map-block-line); stroke-width: 1; }
.su-map .plaza { fill: var(--map-road); stroke: var(--map-block-line); stroke-width: 2; }
.su-map .site { fill: none; stroke: var(--map-site); stroke-width: 2; stroke-dasharray: 8 6; }
.su-map .site.thinline { stroke-width: 1.2; stroke-dasharray: 4 4; }
.su-map .lbl { fill: var(--map-label); font-size: 14px; font-weight: 700; font-family: var(--font-body); }
.su-map .emo { font-size: 24px; }
.su-pin { cursor: pointer; outline: none; }
.su-pin .hit { fill: transparent; }
.su-pin .dotc { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.su-pin .no { fill: var(--ink); font-family: var(--font-num); font-weight: 700; font-size: 17px; pointer-events: none; }
.su-pin .ring { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; }
.su-pin .pname { fill: var(--ink); font-size: 13px; font-weight: 700; paint-order: stroke; stroke: var(--map-ground); stroke-width: 4px; pointer-events: none; }
.su-pin:hover .dotc { stroke-width: 4; }
.su-pin.prev .dotc { fill: var(--accent); stroke-width: 3.5; }
.su-pin.prev .no { fill: var(--accent-ink); }
.su-pin.chosen .dotc, .su-pin.chosen.prev .dotc { fill: var(--kim); stroke: var(--accent); stroke-width: 3.5; }
.su-pin.chosen .no, .su-pin.chosen.prev .no { fill: var(--kim-ink); }
.su-pin:focus-visible .ring { stroke: var(--info); stroke-width: 3; stroke-dasharray: none; }
.su-pin:focus-visible .dotc { stroke: var(--info); stroke-width: 4; }
.su-maplegend { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 4px 0; }
.su-maplegend .lg { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); margin-right: 5px; vertical-align: -1px; }
.su-maplegend .lg.p { background: var(--accent); }
.su-maplegend .lg.c { background: var(--kim); border-color: var(--accent); }

.su-detail { display: flex; flex-direction: column; gap: 12px; }
.su-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.su-kv > div { display: flex; flex-direction: column; min-width: 0; }
.su-kv .wide { grid-column: 1 / -1; }
.su-kv .k { font-size: .76rem; color: var(--ink3); font-weight: 600; }
.su-seg { display: grid; grid-template-columns: 9px 52px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
.su-seg .su-seg-n { font-size: .86rem; }
.su-seg .num { text-align: right; }
.tbl tr[data-act]:hover td { background: var(--surface2); }
.tbl tr.me[data-act]:hover td { background: var(--accent-soft); }

/* 가게 */
.su-tables { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 14px; align-items: center; }
@media (max-width: 600px) { .su-tables { grid-template-columns: minmax(0, 1fr); } }
.su-floor { width: 100%; max-width: 260px; height: auto; }
.su-floor .room { fill: var(--surface2); stroke: var(--ink3); stroke-width: 2; }
.su-floor .kit { fill: var(--line2); stroke: var(--ink3); stroke-width: 1.5; }
.su-floor .tb { fill: var(--accent); stroke: var(--ink); stroke-width: 1.5; }
.su-floor .fl { fill: var(--ink2); font-size: 13px; font-weight: 700; font-family: var(--font-body); }

/* 메뉴 */
.su-mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
.su-mrow:last-child { border-bottom: 0; }
.su-mrow.off { opacity: .72; }
.su-m-sw { min-width: 150px; }
.su-m-name { font-weight: 700; }
.su-m-likes { display: inline-flex; gap: 4px; align-items: center; min-width: 30px; }
.su-legend { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; }

/* 직원 */
.su-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 10px; }
.su-staff { display: flex; flex-direction: column; gap: 8px; }
.su-skill { display: inline-flex; gap: 3px; }
.su-skill i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.su-skill i.on { background: var(--accent); box-shadow: 0 0 0 1px var(--ink3); }

/* 최종 확인 */
.su-sumrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line2); }
.su-sumrow:last-child { border-bottom: 0; }
.su-sumrow .k { color: var(--ink3); font-size: .84rem; font-weight: 600; }
.su-big { margin-top: 12px; padding: 14px 12px; text-align: center; background: var(--kim); color: var(--kim-ink); border-radius: 6px; }
.su-big .tiny, .su-big .muted { color: var(--kim-ink); opacity: .75; }
.su-bignum { font-family: var(--font-display); font-size: 2.6rem; line-height: 1.15; color: var(--accent); }
.su-bignum .num { font-family: var(--font-display); }

/* 직원 카드 머리(얼굴 + 이름) */
.su-staff-h { display: flex; gap: 12px; align-items: flex-start; }

/* 장사의 신 — 영업 화면 (ui-run.js). 색은 모두 base.css 토큰. */

/* ── 상단 상태줄 (포스기 느낌) ── */
.rn-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--kim); color: var(--kim-ink); border-bottom: 3px solid var(--accent); }
.rn-top-in { max-width: 1180px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; }
.rn-top .brand { color: var(--kim-ink); font-size: 1.15rem; }
.rn-t1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.rn-date { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.rn-date b { font-size: .98rem; }
.rn-date .tiny { opacity: .75; }
.rn-prog { flex: 1 1 120px; min-width: 100px; }
.rn-top .bar { background: color-mix(in srgb, var(--kim-ink) 22%, transparent); }
.rn-t2 { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.rn-st { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.rn-st .k { font-size: .68rem; opacity: .7; font-weight: 600; }
.rn-st .v { font-size: .95rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.rn-bad { color: var(--bad); }
.rn-top .rn-bad { background: var(--bad-soft); padding: 0 6px; border-radius: 4px; }
.rn-mini { display: inline-block; width: 54px; height: 7px; border-radius: 999px; background: color-mix(in srgb, var(--kim-ink) 22%, transparent); overflow: hidden; }
.rn-mini i { display: block; height: 100%; background: var(--good); }
.rn-mini.warn i { background: var(--warn); }
@media (max-width: 480px) { .rn-t2 { gap: 4px 12px; } .rn-st .v { font-size: .88rem; } .rn-top .brand i { display: none; } }

.rn-wrap { padding-top: 16px; }
.rn-kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 4px 16px; }
.rn-kv { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; border-bottom: 1px dashed var(--line); padding: 3px 0; }
.rn-kv > span:first-child { color: var(--ink2); }
.rn-tips { margin: 12px 0 0; padding-left: 18px; color: var(--ink2); font-size: .92rem; }
.rn-tips li { margin: 3px 0; }

/* ── 깔때기 ── */
.rn-fun { display: flex; flex-direction: column; gap: 6px; }
.rn-fr { display: grid; grid-template-columns: 112px minmax(0, 1fr) 72px; align-items: center; gap: 8px; }
.rn-fl { font-size: .84rem; font-weight: 600; line-height: 1.25; }
.rn-fn { text-align: right; font-size: .88rem; }
.rn-fb { display: block; height: 16px; border-radius: 3px; background: var(--line2); overflow: hidden; }
.rn-fb i { display: block; height: 100%; border-radius: 3px; background: var(--ink2); }
.rn-fb.info i { background: var(--info); } .rn-fb.accent i { background: var(--accent); } .rn-fb.good i { background: var(--good); }
.rn-fh { font-size: .8rem; color: var(--ink2); padding: 0 0 0 120px; line-height: 1.4; }
.rn-fh.good { color: var(--good); }
.rn-leaks { list-style: none; margin: 0; padding: 6px 10px; border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 6px 6px 0; display: flex; flex-direction: column; gap: 4px; }
.rn-leaks li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
@media (max-width: 480px) { .rn-fr { grid-template-columns: 88px minmax(0, 1fr) 62px; gap: 6px; } .rn-fh { padding-left: 0; } .rn-fl { font-size: .78rem; } }

/* ── 영수증 ── */
.rn-rcpt .rn-rv { display: inline-flex; align-items: baseline; justify-content: flex-end; gap: 10px; flex: none; }
.rn-sh { font-style: normal; color: var(--ink3); font-size: .76rem; min-width: 38px; text-align: right; font-family: var(--font-num); }
.rn-rcpt .rn-subr { color: var(--ink2); font-size: .84rem; padding: 0 0 0 10px; }

/* ── 손님 구성·메뉴 ── */
.rn-stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--line2); }
.rn-stack span { display: block; height: 100%; min-width: 2px; }
.rn-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: .84rem; }
.rn-legend span { display: inline-flex; align-items: center; gap: 5px; }

/* ── 차트 ── */
.rn-ch { margin-top: 10px; }
.rn-ch h4 { margin-bottom: 4px; }
.rn-svg { display: block; width: 100%; height: auto; overflow: visible; }
.rn-svg text { font-family: var(--font-num); font-size: 10px; }
.rn-ax { fill: var(--ink3); }
.rn-lb { fill: var(--ink2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.rn-up { fill: var(--good); } .rn-dn { fill: var(--bad); }
.rn-zero { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 3 3; }
.rn-sep { stroke: var(--line); stroke-width: 1; }
.rn-line { fill: none; stroke: var(--info); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.rn-area { fill: var(--info-soft); stroke: none; }
.rn-pt { fill: var(--info); stroke: var(--surface); stroke-width: 1.5; }

/* ── 사건 기록 ── */
.rn-log { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
.rn-le { display: flex; gap: 10px; align-items: flex-start; }
.rn-tone { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--ink3); }
.rn-tone.good { background: var(--good); } .rn-tone.bad { background: var(--bad); }

/* ── 관리 탭 ── */
.rn-add { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line2); }
.rn-add:last-of-type { border-bottom: 0; }
.rn-add .btn { flex: none; }
.rn-star { color: var(--warn); letter-spacing: 1px; font-size: .9rem; }
.rn-dots { font-size: .7rem; letter-spacing: 1px; }
.rn-sc { display: flex; flex-direction: column; gap: 6px; }
.rn-meter { display: flex; flex-direction: column; gap: 4px; }
.rn-kvs .rn-kv { flex-wrap: wrap; }

/* ── 하단 행동 바 ── */
.rn-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--surface); border-top: 2px solid var(--kim); box-shadow: var(--shadow); }
.rn-bar-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.rn-go { flex: 1 1 220px; min-width: 0; }
@media (max-width: 480px) { .rn-bar-in { gap: 6px 10px; padding-top: 8px; } .rn-go { flex-basis: 100%; } }

/* ── 오늘 카드(하루씩 흐르는 시간) ── */
.rn-live { border: 1.5px solid var(--kim); }
.rn-days { display: flex; align-items: flex-end; gap: 3px; height: 64px; border-bottom: 2px solid var(--kim); margin: 10px 0 12px; }
.rn-days i { flex: 1 1 0; min-width: 0; height: var(--h); background: var(--line2); border-radius: 2px 2px 0 0; transition: height .15s; }
.rn-days i.on { background: var(--accent); }
.rn-days i.on.off { background: var(--ink3); }
.rn-days i.now { box-shadow: 0 0 0 2px var(--kim); }
.rn-live-n { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-end; }
.rn-live-n > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rn-live-n .k { font-size: .76rem; color: var(--ink3); font-weight: 600; }
.rn-live-n .v { font-size: 1.1rem; font-weight: 600; }
.rn-live-n .grow { flex: 1 1 170px; }
.rn-speed { display: inline-flex; gap: 4px; }

/* ── 이벤트 모달 ── */
.rn-evs { display: flex; flex-direction: column; gap: 12px; }
.rn-ev { display: flex; gap: 10px; align-items: flex-start; }
.rn-evi { flex: none; }

/* 하단 고정 바가 두 줄이 되는 좁은 화면에서는 본문 아래 여백을 더 준다 */
@media (max-width: 480px) { #app[data-view="run"] .wrap { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } }
/* 좁은 화면에서는 하단 바가 세 줄이라 알림을 그 위로 올린다 */
@media (max-width: 480px) { #app[data-view="run"] ~ .toasts { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } }

/* ── 가게 내부 그림 ── */
.rn-scene-card { padding: 8px; }
.rn-scene { display: block; width: 100%; aspect-ratio: 2 / 1; border-radius: 6px; background: var(--surface2); }
/* ── 직원 카드 머리(얼굴 + 이름) ── */
.rn-sc-h { display: flex; gap: 10px; align-items: flex-start; }

/* ── 돈 나가는 날·소식 ── */
.rn-pays { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.rn-pay { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 8px; border: 1px solid var(--line2); border-radius: 999px; font-size: .76rem; color: var(--ink2); background: var(--surface); }
.rn-pay b { font-weight: 700; color: var(--ink); }
.rn-pay .num { font-weight: 600; }
.rn-pay.done { color: var(--ink3); border-style: dashed; }
.rn-pay.done b { color: var(--ink3); }
.rn-pay.done .num { color: var(--bad); }
.rn-pay.done.in .num { color: var(--good); }
.rn-pay.now { border: 1.5px solid var(--bad); border-style: solid; background: var(--bad-bg, transparent); color: var(--ink); animation: rn-pop .45s ease-out; }
.rn-pay.now.in { border-color: var(--good); }
.rn-feed { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line2); }
.rn-fd { display: flex; gap: 10px; align-items: flex-start; padding-left: 8px; border-left: 3px solid var(--ink3); }
.rn-fd.bad { border-left-color: var(--bad); } .rn-fd.good { border-left-color: var(--good); } .rn-fd.news { border-left-color: var(--info, var(--ink3)); }
.rn-fd.new { animation: rn-pop .45s ease-out; }
.rn-fdd { flex: none; font-size: .74rem; color: var(--ink3); min-width: 30px; padding-top: 2px; }
.rn-nw { display: inline-block; margin-right: 6px; padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; font-size: .68rem; font-weight: 700; color: var(--ink3); vertical-align: 1px; }
.rn-tone.news { background: var(--info, var(--ink3)); }
@keyframes rn-pop { from { transform: translateY(-3px); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .rn-pay.now, .rn-fd.new { animation: none; } }

/* 장사의 신 — 직원 얼굴(증명사진)과 지원서. 사진은 자체 배경을 가진 하나의 그림이라 고정색을 쓴다. */
:root {
  --pp-bg: #BCD0E2;
  --pp-skin1: #F4D6BF; --pp-skin2: #E8BC98; --pp-skin3: #C99470;
  --pp-hair1: #1D1917; --pp-hair2: #4B3326; --pp-hair3: #B3AFA9;
  --pp-cloth1: #3E5873; --pp-cloth2: #647F68; --pp-cloth3: #9E5649; --pp-cloth4: #4A4A52;
  --pp-collar: #F6F4EE;
  --pp-ink: #3B2A22;      /* 눈·코·주름 선 */
  --pp-mouth: #A4544B;
  --pp-blush: #E8877D;
  --pp-glass: #2E2927;
}

.pp-face { display: block; flex: none; max-width: none; height: auto; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--pp-bg); }
.pp-facebtn { display: inline-block; padding: 0; margin: 0; border: 0; background: none; line-height: 0; cursor: pointer; border-radius: 3px; vertical-align: top; }
.pp-facebtn:hover .pp-face { border-color: var(--ink3); }
.pp-facebtn:active .pp-face { transform: translateY(1px); }

/* ── 지원서 ── */
.pp-paper { container-type: inline-size; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.pp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.pp-headtxt { min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.pp-title { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; letter-spacing: .12em; line-height: 1.15; margin: 0; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }

function seasonOf(L, s, cal) {

/* ───────── 한 달(30일) 영업 시뮬레이션 ───────── */

function rollEvents(G, R) {
  const keys = Object.keys(EV);
  for (let i = keys.length - 1; i > 0; i--) { const j = Math.floor(rnd(G) * (i + 1)); const t = keys[i]; keys[i] = keys[j]; keys[j] = t; }
  let n = 0;
  for (const k of keys) {
    if (n >= 2) break;
    const e = EV[k];
    if (e.cat && (G.flags['cd_' + e.cat] || 0) > G.month) continue;            // 같은 분류는 한동안 쉰다
    if (e.lead && G.sched.some(x => x.key === 'ev' && x.data.id === k)) continue;   // 이미 예고된 일
    const p = e.p(G) * TUNE.events / (e.lead ? 1 - missOf(e) : 1);
    if (!(p > 0 && chance(G, p))) continue;
    if (e.lead) {
      const lead = Array.isArray(e.lead) ? ri(G, e.lead[0], e.lead[1]) : e.lead, nw = e.news(G);
      schedule(G, lead, 'ev', { id: k }); R.news.push({ title: nw[0], text: nw[1] });
      continue;
    }
    if (fireEvent(G, R, k)) n++;

  let t = 0, prev = 0;
  for (const b of B) { const top = b[0] * MAN; if (p > prev) t += (Math.min(p, top) - prev) * b[1]; prev = top; }
  return t * 1.1;
}

/* ───────── 공개 API ───────── */

E.chooseLoc = function (G, id) {

E.setupCost = function (G) {
  const items = []; const L = G.loc && LOC_BY[G.loc.id];

  }

  return { items, total, seed: TUNE.seed, loan, loanPay, cashAfter: TUNE.seed + loan - total };
};

function addLoan(G, type, amt) {
  const d = LOANS[type];
  const rate = d.rate + (type === 'bank' || type === 'second' ? G.idx.rate : 0);
  const ln = { type, name: d.name, principal: amt, rate, left: type === 'family' ? 0 : 60, pay: 0 };
  if (ln.left) ln.pay = pmt(amt, rate, 60);
  G.loans.push(ln);
}

E.openShop = function (G) {
  if (G.phase !== 'setup' || !G.loc) return false;

  for (const k of ['policy', 'bank', 'second']) { const a = G.setupLoans[k]; if (a > 0) { addLoan(G, k, a); if (G.credit[k] != null) G.credit[k] -= a; } }
  G.fryer = needsFryer(G);
  G.invest = { deposit: L.deposit, premium: L.premium, interior: INTERIOR[G.interior].perPy * L.size, equip: EQUIP[G.equip].cost + G.tables * TABLE_COST + (G.fryer ? FRYER_COST : 0), total: c.total };
  if (G.training) G.ownerSkill = 2.6;

  G.comps = L.comps.map(t => ({ type: t, str: COMP[t].str * rr(G, .9, 1.1), age: 12, name: COMP[t].name }));

/* 월 고정비와 손익분기 추정 (창업 준비·운영 화면 공용) */
E.estimate = function (G) {
  if (!G.loc) return null;
  const L = LOC_BY[G.loc.id], ms = menuStats(G), st = staffing(G, ms);
  let labor = 0; G.staff.forEach(w => labor += w.wage * (w.full ? 1.1 : 1.03));
  const rent = G.loc.rent + G.loc.mgmt;
  const misc = 68 * MAN + 7 * MAN * ms.n + (needsFryer(G) ? 12 * MAN : 0) + (G.ops.cleaning ? 18 * MAN : 0);
  const util = (36 + 3.2 * (HOURS[G.ops.hours].h - 10)) * MAN * G.idx.util;
  const marketing = (G.ops.flyer ? 30 * MAN : 0) + (G.ops.sns ? 60 * MAN : 0);
  let loanPay = 0;
  if (G.phase === 'setup') loanPay = E.setupCost(G).loanPay; else G.loans.forEach(l => loanPay += l.pay);
  let ticket = 0, cost = 0, psum = 0;
  SEGS.forEach(s => { const w = L.pop[s]; psum += w; ticket += w * ms.seg[s].ticket; cost += w * ms.seg[s].cost; });
  ticket /= psum; cost /= psum;
  const varRate = cost / ticket + 0.05 + 0.027 + 0.024 + VAT;   // 재료+폐기+수수료·포장+공과금 변동분+부가세
  const fixed = rent + labor + misc + util + marketing;
  const need = fixed + loanPay + TUNE.living;
  return {
    rent, labor, misc, util, marketing, loanPay, living: TUNE.living, fixed, ticket, costRate: cost / ticket, varRate,
    bepShop: fixed / (1 - varRate), bepAll: need / (1 - varRate), bepCust: need / (1 - varRate) / ticket / 30,
    kitchenPerHour: st.K[1], hallPerHour: st.H[1], lunchCap: Math.min(st.K[1], st.H[1] * 1.5) * SLOT_H[1], seatCap: G.tables * 4.8 * SLOT_H[1], menuCount: ms.n, complexity: ms.cx,
    kitchenSlow: 1 - 1 / (1 + 0.045 * Math.max(0, ms.cx - 3))
  };
};

/* ── 행동(창업 준비 중에는 무료, 영업 중에는 비용 발생) ── */
E.toggleMenu = function (G, id) {

E.setPrice = function (G, id, price) {

E.setTables = function (G, n) {

  if (G.phase === 'run' && diff > 0) { cost = diff * TABLE_COST; spend(G, cost); G.invest.equip += cost; }

E.setGrade = function (G, g) { if (!GRADE[g]) return false; G.grade = g; return true; };
E.setOp = function (G, key, value) {

};
E.hire = function (G, id) {
  const i = G.candidates.findIndex(c => c.id === id); if (i < 0) return false;
  const c = G.candidates.splice(i, 1)[0]; c.tenure = 0; G.staff.push(c); return true;
};
E.unhire = function (G, id) {   // 창업 준비 단계에서 채용 취소
  if (G.phase !== 'setup') return false;
  const i = G.staff.findIndex(c => c.id === id); if (i < 0) return false;
  G.candidates.push(G.staff.splice(i, 1)[0]); return true;
};
E.fireCost = function (G, id) { const w = G.staff.find(x => x.id === id); if (!w) return 0; return severance(w) + (w.tenure >= 3 ? w.wage : 0); };
E.fire = function (G, id) {

  return { ok: true, cost, msg: `${w.name} 씨를 내보냈습니다.` + (cost ? ` 해고수당·퇴직금 ${won(cost)} 지급.` : '') };
};
E.raise = function (G, id, pct) {
  const w = G.staff.find(x => x.id === id); if (!w) return false;
  w.wage = Math.round(w.wage * (1 + (pct || .05)) / MAN) * MAN; return true;
};
E.postAd = function (G) {
  if (G.phase !== 'run' || G.adUsed) return { ok: false, msg: '이번 달에는 이미 구인광고를 냈습니다.' };
  spend(G, 20 * MAN); G.adUsed = true;
  const n = (G.flags.droughtUntil || 0) >= G.month ? (chance(G, .4) ? 1 : 0) : ri(G, 1, 2);
  for (let i = 0; i < n; i++) G.candidates.push(genCandidate(G));
  return { ok: true, n, msg: n ? `구인광고(20만원)를 보고 ${n}명이 지원했습니다.` : '구인광고(20만원)를 냈지만 아무도 지원하지 않았습니다.' };
};
E.researchCost = function (G, id) { return (120 + 80 * (G.recipe[id] || 0)) * MAN; };
E.research = function (G, id) {
  if (!G.menu[id]) return { ok: false, msg: '판매 중인 메뉴만 연구할 수 있습니다.' };
  if (G.phase === 'run' && G.researched) return { ok: false, msg: '레시피 연구는 한 달에 한 번만 할 수 있습니다.' };
  const lv = G.recipe[id] || 0; if (lv >= 3) return { ok: false, msg: '이미 최고 수준입니다.' };
  const cost = E.researchCost(G, id);
  if (G.phase === 'run') { spend(G, cost); G.researched = true; } else return { ok: false, msg: '개업 후에 연구할 수 있습니다.' };
  const success = chance(G, clamp(.5 + .08 * G.ownerSkill, 0, .88));
  if (success) G.recipe[id] = lv + 1;
  return { ok: true, success, cost, msg: success ? `${MENU[id].name} 레시피 개선 성공! 이 메뉴가 더 잘 팔리고 평판에도 도움이 됩니다. (${won(cost)} 지출)` : `${MENU[id].name} 새 레시피는 시식 반응이 시큰둥했습니다. 연구비 ${won(cost)}만 날렸습니다.` };
};
E.borrow = function (G, type, amt) {
  if (G.phase !== 'run' || type === 'policy' || !LOANS[type]) return false;
  amt = Math.min(Math.round(amt), G.credit[type]); if (amt <= 0) return false;
  G.credit[type] -= amt; addLoan(G, type, amt); G.cash += amt; G.acc.fin += amt; return true;
};
E.repay = function (G, i, amt) {
  const ln = G.loans[i]; if (!ln) return false;
  amt = Math.min(Math.round(amt), Math.ceil(ln.principal), Math.max(0, G.cash)); if (amt <= 0) return false;
  ln.principal -= amt; G.cash -= amt; G.acc.fin -= amt;
  if (ln.principal < 1) G.loans.splice(i, 1); else if (ln.left) ln.pay = pmt(ln.principal, ln.rate, ln.left);
  return true;
};

/* 가게 시세(권리금) 추정 */
E.quote = function (G) {
  const L = LOC_BY[G.loc.id]; const rec = G.hist.slice(-6);
  const avgOp = rec.length ? rec.reduce((a, h) => a + h.op, 0) / rec.length : 0;
  const biz = Math.max(0, avgOp - 250 * MAN) * 8;
  const floor = L.premium * G.loc.areaIdx * (avgOp > 0 ? .85 : .45);
  const fac = ((G.invest.interior || 0) + (G.invest.equip || 0)) * Math.max(.08, .5 * (1 - G.month / 72));
  return { avgOp, biz, floor, fac, total: Math.round(biz + floor + fac) };
};
function pendingTax(G) { return G.acc.vat * VAT + incomeTax(G.acc.lastYearProfit) + incomeTax(G.acc.yearProfit); }
function settle(G, type, salePrice) {
  const L = LOC_BY[G.loc.id]; const lines = [];
  lines.push({ label: '보유 현금', amount: Math.round(G.cash) });
  lines.push({ label: '보증금 반환', amount: G.invest.deposit });
  if (type === 'sold' || type === 'complete') {
    lines.push({ label: type === 'sold' ? '가게 매각 대금(권리금)' : '가게 가치(권리금 시세)', amount: Math.round(salePrice) });
    lines.push({ label: '중개수수료', amount: -Math.round(salePrice * 0.02) });
  } else {
    lines.push({ label: '원상복구(철거)비', amount: -L.size * 22 * MAN });
    lines.push({ label: '집기 중고 처분', amount: Math.round((G.invest.equip || 0) * Math.max(.05, .3 * (1 - G.month / 60))) });
    const sev = G.staff.reduce((a, w) => a + severance(w), 0); if (sev) lines.push({ label: '직원 퇴직금', amount: -sev });
  }
  const tax = Math.round(pendingTax(G)); if (tax > 0) lines.push({ label: '밀린 세금 정산', amount: -tax });
  const debt = Math.round(G.loans.reduce((a, l) => a + l.principal, 0)); if (debt > 0) lines.push({ label: '남은 대출 상환', amount: -debt });
  const net = lines.reduce((a, l) => a + l.amount, 0);
  lines.push({ label: '처음 넣은 내 돈', amount: -TUNE.seed });
  return { lines, net, score: Math.round(net - TUNE.seed) };
}
E.liquidation = function (G) { return settle(G, 'closed', 0); };
E.finish = function (G, type, price) {
  if (G.phase === 'end') return G.result;
  if (type === 'complete') price = E.quote(G).total * 0.9;
  const s = settle(G, type, price || 0);
  G.result = { type, month: G.month, score: s.score, net: s.net, lines: s.lines, loc: LOC_BY[G.loc.id].name, name: G.name };
  G.phase = 'end'; G.pending = []; G.ops.listing = false;
  return G.result;
};
E.closeShop = function (G) { if (G.phase !== 'run') return null; return E.finish(G, 'closed'); };

E.resolve = function (G, i, c) {
  const p = G.pending[i]; if (!p) return null;
  G.pending.splice(i, 1);
  const res = CHOOSE[p.id] ? CHOOSE[p.id](G, p.data || {}, c) : '';
  G.rep = clamp(G.rep, 0, 100);
  G.log.push({ m: G.month, tone: p.tone, title: p.title, text: res });
  return res;
};

/* ── 돈 나가는 날 ──
   한 달 치 돈의 흐름을 날짜에 박는다. 매출은 매일 들어오고(R.days), 나가는 돈은 정해진 날에 한꺼번에 빠진다.
   flow = [{ day, k, label, amt(들어오면 +, 나가면 -), fixed(미리 아는 금액) }] */
function monthFlow(x) {
  const f = [];
  const add = (day, k, label, amt, fixed) => { amt = Math.round(amt); if (amt) f.push({ day, k, label, amt, fixed: !!fixed }); };
  add(5, 'living', '생활비', -x.living, true);
  add(10, 'supply', '식자재 대금', -x.supply);
  add(12, 'extra', '단체 주문', x.extra);
  add(15, 'bills', '공과금·수수료·경비', -x.bills);
  add(18, 'oneoff', x.oneoff < 0 ? '지원금' : '돌발 지출', -x.oneoff);
  add(20, 'loan', '대출 원리금', -x.loan, true);
  add(25, 'pay', '직원 월급', -x.pay, true);
  add(25, 'tax', x.taxNote || '세금', -x.tax);
  add(30, 'rent', '월세·관리비', -x.rent, true);
  return f;
}
function flowWalk(cash0, days, flow) {   // 달 안에서 통장이 가장 낮아지는 순간을 찾는다
  let bal = cash0, min = Infinity, at = null, firstNeg = 0;
  for (let d = 1; d <= 30; d++) {
    bal += days[d - 1] || 0;
    for (const x of flow) if (x.day === d) { bal += x.amt; if (bal < min) { min = bal; at = x; } if (bal < 0 && !firstNeg) firstNeg = d; }
  }
  return { min, at, end: bal, firstNeg };
}

/* ── 한 달 진행 ── */
E.runMonth = function (G) {
  if (G.phase !== 'run') return null;
  while (G.pending.length && G.phase === 'run') E.resolve(G, 0, G.pending[0].def || 0);
  if (G.phase !== 'run') return null;
  G.month++;
  const m = G.month, cal = calOf(m), L = LOC_BY[G.loc.id];
  G.mods = G.mods.filter(o => o.until >= m);
  const R = { m, cal, year: yearOf(m), events: [], news: [] };
  if (!G.sched) G.sched = [];
  const pre = { cash: G.cash, oneoff: G.acc.oneoff, fin: G.acc.fin };   // 이번 달 시작 시점
  G.tmp = { rev: 0, cogs: 0, closed: G.flags.closedNext || 0 }; G.flags.closedNext = 0;
  G.idx.cost *= 1 + TUNE.costInfl / 12; G.idx.ref *= 1 + TUNE.refInfl / 12;

  if (cal === 8) {   // 최저임금은 여름에 정해져 1월에 오른다
    G.flags.wageNext = rr(G, .015, .05);
    R.news.push({ title: '내년 최저임금 확정', text: `내년 최저임금이 ${pc(G.flags.wageNext)} 오릅니다. 1월부터 직원 월급이 그만큼 오릅니다.` });
  }
  if (cal === 1) {
    const inc = G.flags.wageNext || rr(G, .015, .05); G.flags.wageNext = 0; G.idx.wage *= 1 + inc;
    G.staff.forEach(w => { w.wage = Math.round(w.wage * (1 + inc) / MAN) * MAN; });
    R.events.push(ev('bad', '최저임금 인상', `새해 최저임금이 ${pc(inc)} 올랐습니다. 직원 월급이 모두 그만큼 오릅니다.`));
  }
  if (m === 23 || m === 47) R.news.push({ title: '임대차 만기 두 달 전', text: '두 달 뒤 임대차 계약이 끝납니다. 건물주가 월세 인상을 요구할 수 있습니다.' });
  if (m === 25 || m === 49) leaseRenewal(G, R);

  const man = n => X.won(n * MAN);
  const round = (v, unit) => Math.round(v / (unit || MAN)) * (unit || MAN);
  const rel = (w, d) => { w.reliab = X.clamp((w.reliab == null ? .7 : w.reliab) + d, .3, .99); };
  const cnt = (G, k) => (G.flags.sfN && G.flags.sfN[k]) || 0;
  const mark = (G, k) => { const n = G.flags.sfN || (G.flags.sfN = {}); n[k] = (n[k] || 0) + 1; G.flags.sfLast = k; };
  const open = (G, k, max) => G.flags.sfLast !== k && cnt(G, k) < (max || 2);
  const live = G => G.staff.filter(w => !w.quitNext);
  const sc = G => [0, .65, .88, 1, 1.1][Math.min(4, live(G).length)];   // 직원이 많을수록 사람 문제도 잦다
  const find = (G, id) => G.staff.find(x => x.id === id);
  const GONE = '그 사이 직원이 이미 그만뒀습니다.';
  const who = w => ({ kind: 'staff', id: w.id });
  const absentNext = (G, w) => { (G.flags.sfAbs || (G.flags.sfAbs = [])).push(w.id); };

  // 다음 달 시작 직후(직원 정리 뒤) 결근 처리
  HOOKS.month.push(G => {
    const a = G.flags.sfAbs; if (!a || !a.length) return;
    G.staff.forEach(w => { if (a.indexOf(w.id) >= 0) w.absent = true; });
    G.flags.sfAbs = [];
  });

  /* ── 1. 노동청 진정 ── */
  const labQ = x => (x.how === 'fired' ? .09 : x.how === 'ghost' ? .05 : .03) * (x.full ? 1 : 1.3);
  const labCands = G => (G.ex || []).filter(x => x.tenure >= 3 && G.month - x.m >= 1 && G.month - x.m <= 3 && (G.flags.sfLab || []).indexOf(x.id) < 0);
  EV.sfLabor = { cat: 'staff', cool: 3,
    p: G => { const c = labCands(G); if (!c.length || !open(G, 'sfLabor', 3)) return 0; return 1 - c.reduce((a, x) => a * (1 - labQ(x)), 1); },
    run(G) {
      const c = labCands(G); if (!c.length) return null;
      const x = X.pick(G, c);
      (G.flags.sfLab || (G.flags.sfLab = [])).push(x.id); mark(G, 'sfLabor');
      const job = jobOf(x);
      const items = !x.full ? (x.tenure >= 12 ? '주휴수당과 퇴직금' : '주휴수당')
        : x.how === 'fired' ? '해고예고수당과 주휴수당' : (x.tenure >= 12 ? '퇴직금 차액과 주휴수당' : '주휴수당과 마지막 달 임금');
      const tag = x.how === 'fired' ? '내보냈던' : x.how === 'ghost' ? '말없이 나갔던' : '그만둔';
      const settle = Math.max(30 * MAN, round(x.wage * X.rr(G, .5, 1.2)));
      const lo = round(x.wage * 1.3 + 30 * MAN), hi = round(x.wage * 2 + 100 * MAN);
      return { tone: 'bad', title: '노동청 출석 요구서', who: who(x),
        text: `노동청에서 출석 요구서가 왔습니다. ${tag} ${job} ${x.name} 씨가 ${X.eul(items)} 못 받았다며 진정을 넣었습니다.`,
        choices: [
          { t: '합의금을 주고 끝낸다', d: `합의금 ${X.won(settle)}을 주고 진정을 취하하게 합니다.` },
          { t: '끝까지 다툰다', d: `50% 확률로 무혐의, 50% 확률로 체불 인정(과태료 포함 ${X.won(lo)}~${X.won(hi)}). 스트레스가 쌓입니다.` }],
        data: { name: x.name, settle, lo, hi }, def: 0 };
    } };
  CHOOSE.sfLabor = (G, d, c) => {
    if (c === 0) { X.spend(G, d.settle); return `${d.name} 씨에게 합의금 ${X.won(d.settle)}을 보내자 진정이 취하됐습니다. 마음은 편하지 않습니다.`; }
    if (X.chance(G, .5)) { X.stressAdd(G, 4); return `노동청에 두 번 불려 다닌 끝에 무혐의로 끝났습니다. 가게를 비운 시간과 속앓이만 남았습니다.`; }
    const pay = round(X.rr(G, d.lo, d.hi));
    X.spend(G, pay); X.stressAdd(G, 10);
    return `체불이 일부 인정돼 미지급액과 과태료로 ${X.won(pay)}을 냈습니다. "처음부터 줬으면 될 걸"이라는 말이 귀에 남습니다.`;
  };

  /* ── 2. 스카웃 ── */
  EV.sfPoach = { cat: 'staff', cool: 3,
    p: G => (open(G, 'sfPoach') && live(G).some(w => w.skill >= 3 && w.tenure >= 4) ? .021 * sc(G) : 0),
    run(G) {
      const c = live(G).filter(w => w.skill >= 3 && w.tenure >= 4); if (!c.length) return null;
      const w = X.pick(G, c); mark(G, 'sfPoach');
      return { tone: 'neutral', title: `${w.name} 씨 스카웃 제의`, who: who(w),
        text: `"옆 가게에서 월 20만원 더 준대요." ${jobOf(w)} ${nm(w)}(${w.tenure}개월 근무)가 눈을 마주치지 못하고 말했습니다.`,
        choices: [
          { t: '월급을 맞춰 준다', d: `월급을 20만원 올려 ${X.won(w.wage + 20 * MAN)}을 줍니다. 남습니다.` },
          { t: '보너스 50만원', d: '50만원을 한 번 주고, 60% 확률로 남고 40% 확률로 다음 달 그만둡니다.' },
          { t: '보내 준다', d: '다음 달 그만둡니다.' }],
        data: { sid: w.id }, def: 1 };
    } };
  CHOOSE.sfPoach = (G, d, c) => {
    const w = find(G, d.sid); if (!w) return GONE;
    if (c === 0) { w.wage += 20 * MAN; rel(w, .05); return `${nm(w)}의 월급을 ${X.won(w.wage)}으로 올렸습니다. 고개를 숙이며 고맙다고 했습니다.`; }
    if (c === 1) {
      X.spend(G, 50 * MAN);
      if (X.chance(G, .6)) { rel(w, .03); return `${nm(w)}가 봉투를 받고 "그럼 있겠습니다"라고 했습니다. 50만원이 나갔습니다.`; }
      w.quitNext = true; return `봉투를 받고도 ${nm(w)}는 이번 달까지만 하겠다고 했습니다. 50만원만 날렸습니다.`;
    }
    w.quitNext = true; return `${nm(w)}가 "그동안 감사했습니다"라며 인사했습니다. 다음 달부터 옆 가게에서 일합니다.`;
  };

  /* ── 3. 주방 이모의 독립 ── */
  const indepOk = w => w.role === 'kitchen' && w.full && w.skill >= 4 && w.tenure >= 18 && !w.quitNext;
  EV.sfIndep = { cat: 'staff', cool: 3,
    p: G => (cnt(G, 'sfIndep') < 1 && G.flags.sfLast !== 'sfIndep' && G.staff.some(indepOk) ? .03 : 0),
    run(G) {
      const c = G.staff.filter(indepOk); if (!c.length) return null;
      const w = X.pick(G, c); mark(G, 'sfIndep');
      return { tone: 'neutral', title: `${w.name} 씨의 독립`, who: who(w),
        text: `"사장님, 저 근처에 제 김밥집을 내려고 합니다." ${jobOf(w)} ${nm(w)}가 ${w.tenure}개월 만에 속내를 털어놓았습니다. 우리 단골의 입맛도 손맛도 다 아는 사람입니다.`,
        choices: [
          { t: '월급 15% 인상', d: `월급을 ${X.won(round(w.wage * 1.15))}으로 올립니다. 55% 확률로 남고, 45%는 그래도 떠나 근처에 가게를 엽니다.` },
          { t: '축하하며 보낸다', d: '다음 달 그만두고, 두세 달 뒤 근처에 그 사람의 김밥집이 문을 엽니다.' }],
        data: { sid: w.id, name: w.name }, def: 0 };
    } };
  const leaveAndOpen = (G, w) => {
    w.quitNext = true;
    const cname = MOM.indexOf(w.name.slice(1)) >= 0 ? `${w.name[0]} 이모 김밥` : `${w.name[0]}씨네 김밥`;
    X.schedule(G, X.ri(G, 2, 3), 'sfComp', { name: w.name, cname });
  };
  CHOOSE.sfIndep = (G, d, c) => {
    const w = find(G, d.sid); if (!w) return GONE;
    if (c === 0) {
      if (X.chance(G, .55)) { w.wage = round(w.wage * 1.15); rel(w, .05); return `"사장님이 이렇게까지 하시는데요." ${nm(w)}가 계획을 접고 월급 ${X.won(w.wage)}에 계속 일하기로 했습니다.`; }
      leaveAndOpen(G, w); return `월급을 올려 주겠다고 했지만 ${nm(w)}의 마음은 이미 정해져 있었습니다. 다음 달에 떠납니다.`;
    }
    leaveAndOpen(G, w); return `"꼭 잘되세요." 손을 맞잡았지만 속이 편하지는 않습니다. ${nm(w)}는 다음 달에 떠납니다.`;
  };
  LATER.sfComp = (G, R, d) => {
    G.comps.push({ type: 'bunsik', str: X.COMP.bunsik.str * 1.1, age: 0, name: d.cname });
    R.events.push(X.ev('bad', `${d.cname} 개업`, `${d.name} 씨가 근처에 ${X.eul(d.cname)} 열었습니다. 우리 가게 단골 몇이 그쪽으로 옮겼습니다.`));
  };

  /* ── 4. 직원 간 다툼 ── */
  const COMPLAIN = ['저만 맨날 설거지만 해요.', '자기 일을 자꾸 저한테 넘기잖아요.', '마감을 번번이 저한테 미루고 먼저 가요.', '손님 앞에서 저한테 반말을 해요.'];
  EV.sfFight = { cat: 'staff', cool: 3,
    p: G => (open(G, 'sfFight') && live(G).length >= 2 ? .017 : 0),
    run(G) {
      const c = live(G); if (c.length < 2) return null;
      const a = X.pick(G, c), b = X.pick(G, c.filter(x => x !== a)); mark(G, 'sfFight');
      const say = X.pick(G, COMPLAIN);
      return { tone: 'bad', title: '직원끼리 다툼', who: who(a),
        text: `마감 후 ${a.name} 씨와 ${b.name} 씨가 언성을 높였습니다. ${a.name} 씨는 "${say}"라며 사장님의 판단을 요구합니다.`,
        choices: [
          { t: `${a.name} 씨 편`, d: `${a.name} 씨 편을 듭니다. ${b.name} 씨가 40% 확률로 다음 달 그만둡니다.` },
          { t: `${b.name} 씨 편`, d: `${b.name} 씨 편을 듭니다. ${a.name} 씨가 40% 확률로 다음 달 그만둡니다.` },
          { t: '회식으로 푼다', d: '30만원 지출. 70% 확률로 화해하고, 30%는 둘 다 서먹해집니다.' }],
        data: { a: a.id, b: b.id }, def: 2 };
    } };
  CHOOSE.sfFight = (G, d, c) => {
    const a = find(G, d.a), b = find(G, d.b);
    if (!a || !b) return '한 사람이 이미 그만둬서 다툼은 흐지부지 끝났습니다.';
    if (c === 2) {
      X.spend(G, 30 * MAN);
      if (X.chance(G, .7)) { rel(a, .03); rel(b, .03); return '삼겹살에 소주 몇 잔이 돌자 두 사람이 서로 사과했습니다. 30만원이 나갔습니다.'; }
      rel(a, -.05); rel(b, -.05); return '회식 자리에서도 두 사람은 말을 섞지 않았습니다. 30만원을 쓰고도 분위기는 그대로입니다.';
    }
    const win = c === 0 ? a : b, lose = c === 0 ? b : a;
    rel(win, .05); rel(lose, -.05);
    if (X.chance(G, .4)) { lose.quitNext = true; return `${nm(win)} 편을 들자 ${nm(lose)}가 말없이 앞치마를 벗었습니다. 이번 달까지만 일합니다.`; }
    return `${nm(win)} 편을 들었습니다. ${nm(lose)}는 입을 꾹 다문 채 일을 이어 갑니다.`;
  };

  /* ── 5. 주방 사고(산재) ── */
  const HURT = ['칼에 손가락을 깊게 베여 응급실에서 일곱 바늘을 꿰맸습니다', '끓는 기름이 튀어 팔뚝에 화상을 입었습니다'];
  EV.sfInjury = { cat: 'staff', cool: 3,
    p: G => (open(G, 'sfInjury') && live(G).some(w => w.role === 'kitchen') ? .016 * sc(G) : 0),
    run(G) {
      const c = live(G).filter(w => w.role === 'kitchen'); if (!c.length) return null;
      const w = X.pick(G, c); mark(G, 'sfInjury');
      return { tone: 'bad', title: `${w.name} 씨 주방 사고`, who: who(w),
        text: `${jobOf(w)} ${nm(w)}가 ${X.pick(G, HURT)}. 의사는 2주는 쉬어야 한다고 합니다.`,
        choices: [
          { t: '산재 처리한다', d: `서류와 대체 인력비로 10만~20만원. ${nm(w)}는 다음 달 쉬고 주방이 조금 느려집니다.` },
          { t: '치료비를 현금으로', d: '30만~80만원을 바로 주고 넘어갑니다. 25% 확률로 나중에 분쟁이 생겨 150만~300만원이 듭니다.' }],
        data: { sid: w.id, name: w.name }, def: 0 };
    } };
  CHOOSE.sfInjury = (G, d, c) => {
    const w = find(G, d.sid);
    if (c === 0) {
      const cost = X.spend(G, X.ri(G, 10, 20) * MAN);
      if (w) { absentNext(G, w); X.addMod(G, 'kitchen', .93, 2); }
      return `정식으로 산재 신청을 했습니다. 대체 인력과 서류에 ${X.won(cost)}이 들었고 ${d.name} 씨는 한동안 쉽니다.`;
    }
    const cost = X.spend(G, X.ri(G, 30, 80) * MAN);
    if (X.chance(G, .25)) X.schedule(G, X.ri(G, 4, 10), 'sfInjuryLater', { name: d.name, cost: X.ri(G, 150, 300) * MAN });
    return `치료비 ${X.won(cost)}을 현금으로 건네고 공상으로 넘어갔습니다. 서류는 한 장도 남지 않았습니다.`;
  };
  LATER.sfInjuryLater = (G, R, d) => {
    X.spend(G, d.cost);
    R.events.push(X.ev('bad', '묻어 둔 사고의 후폭풍', `${d.name} 씨가 후유증을 이유로 뒤늦게 산재를 신청했습니다. 신고 의무 위반 과태료와 합의금으로 ${X.won(d.cost)}이 나갔습니다.`));
  };

  /* ── 6. 상습 지각 ── */
  EV.sfLate = { cat: 'staff', cool: 3,
    p: G => (open(G, 'sfLate') && live(G).some(w => !w.full) ? .018 * sc(G) : 0),
    run(G) {
      const c = live(G).filter(w => !w.full); if (!c.length) return null;
      const w = X.pick(G, c); mark(G, 'sfLate');
      return { tone: 'bad', title: `${w.name} 씨 상습 지각`, who: who(w),
        text: `${jobOf(w)} ${nm(w)}가 이번 달에만 일곱 번 늦었습니다. 손님이 기다려도 휴대폰에서 눈을 떼지 않습니다.`,
        choices: [
          { t: '따끔하게 경고한다', d: '40% 확률로 다음 달 그만두고, 60% 확률로 태도가 나아집니다.' },
          { t: '그냥 둔다', d: '두 달간 일 속도가 5% 떨어지고 평판이 1점 깎입니다.' }],
        data: { sid: w.id }, def: 0 };
    } };
  CHOOSE.sfLate = (G, d, c) => {
    const w = find(G, d.sid); if (!w) return GONE;
    if (c === 0) {
      if (X.chance(G, .4)) { w.quitNext = true; return `"그럼 그만두겠습니다." ${nm(w)}가 앞치마를 던지듯 벗었습니다. 이번 달까지만 나옵니다.`; }
      rel(w, .08); return `${nm(w)}가 얼굴이 빨개져 사과했습니다. 다음 날부터 십 분 일찍 나옵니다.`;
    }
    X.addMod(G, modKey(w), .95, 3); G.rep -= 1;
    return `못 본 척하기로 했습니다. 손님 앞에서 늘어진 모습이 계속 눈에 띕니다.`;
  };

  /* ── 7. 직원 경조사 ── */
  EV.sfCeremony = { cat: 'staff', cool: 3,
    p: G => (open(G, 'sfCeremony') && live(G).length ? .019 * sc(G) : 0),
    run(G) {
      const c = live(G); const w = X.pick(G, c); mark(G, 'sfCeremony');
      const kinds = w.full ? ['부친상', '모친상', '결혼'] : ['부친상', '모친상'];
      const k = X.pick(G, kinds), wed = k === '결혼';
      return { tone: 'neutral', title: wed ? `${w.name} 씨 결혼` : `${w.name} 씨 ${k}`, who: who(w),
        text: wed ? `${jobOf(w)} ${nm(w)}가 청첩장을 내밀었습니다. "신혼여행 때문에 며칠 쉬어야 할 것 같아서요."`
          : `${jobOf(w)} ${nm(w)}의 ${k} 소식이 전해졌습니다. 장례 사흘 동안 자리를 비워야 합니다.`,
        choices: [
          { t: '봉투와 사흘 휴가', d: `${wed ? '축의금' : '조의금'} 20만원을 내고 사흘 휴가를 줍니다. 다음 달 일손이 줄어듭니다.` },
          { t: '봉투만 전한다', d: '10만원만 내고 휴가는 주지 않습니다.' },
          { t: '모른 척한다', d: '아무것도 하지 않습니다. 서운해한 직원이 25% 확률로 다음 달 그만둡니다.' }],
        data: { sid: w.id, kind: k }, def: 0 };
    } };
  CHOOSE.sfCeremony = (G, d, c) => {
    const w = find(G, d.sid); if (!w) return GONE;
    const wed = d.kind === '결혼';
    if (c === 0) { X.spend(G, 20 * MAN); rel(w, .08); absentNext(G, w); return `${wed ? '축의금' : '조의금'} 20만원과 사흘 휴가를 챙겨 줬습니다. ${nm(w)}가 깊이 고개를 숙였습니다.`; }
    if (c === 1) { X.spend(G, 10 * MAN); return `${wed ? '축의금' : '조의금'} 10만원만 전했습니다. ${nm(w)}는 "감사합니다"라고만 했습니다.`; }
    rel(w, -.1);
    if (X.chance(G, .25)) { w.quitNext = true; return `끝내 모른 척했습니다. ${nm(w)}는 한 달 뒤 그만두겠다는 말을 남겼습니다.`; }
    return `모른 척 지나갔습니다. ${nm(w)}의 표정이 한동안 어둡습니다.`;
  };

  /* ── 8. 가불 요청 ── */
  EV.sfAdvance = { cat: 'staff', cool: 3,

      { n: c => '편의점 ' + c.s + ' 사장님', job: '근처 편의점 사장', sex: 'x', age: [40, 55], L: ['교대 시간에 {F} 몰래 드시러 오십니다.'] },
      { n: c => c.s + ' 반장님', job: '공사장 반장', sex: 'm', age: [45, 58], cap: true, L: ['인부들 몫까지 {f} 스무 줄씩 주문하곤 합니다.', '새참 시간 전에 {F} 미리 사 두십니다.'] }
    ]
  };
  const GEN = {
    office: ['점심마다 {f} 한 줄, 늘 같은 자리에 앉습니다.', '비 오는 날이면 {F} 포장해서 사무실로 뛰어갑니다.'],

  };
  const TYPE_W = {      // 상권별 예민한 점
    office: { price: 1, time: 3, taste: 1.5, loyal: 1.5 },

  function makeRegular(G, seg) {
    const g = gs(G), m = G.month, all = Object.keys(G.menu);

    const used = {}; g.list.concat(g.gone).forEach(r => used[r.name] = 1);
    let r = null;
    for (let t = 0; t < 12; t++) {

      const c = { s: X.pick(G, SUR), room: String(X.ri(G, 1, 15) * 100 + X.ri(G, 1, 6)) };
      const sex = tpl.sex === 'm' || tpl.sex === 'f' ? tpl.sex : (X.chance(G, .5) ? 'm' : 'f');

  const eun = s => s + ((s.charCodeAt(s.length - 1) - 0xAC00) % 28 ? '은' : '는');   // 받침에 따라 은/는

  /* ───────── 매달 처음: 새 단골 · 좋은 일 ───────── */
  const GROUP_FOR = { office: '사무실 점심으로', student: '학급 모임용으로', resident: '경로당 모임용으로', transit: '교대 근무자들 간식으로' };
  HOOKS.month.push(function (G, R) {

        }
      }
    }
  });

  /* ───────── 매달 끝: 지난달 결과에 대한 반응 ───────── */
  const PARTING = {
    price: ['"사장님, 여기도 올랐네요. 당분간은 도시락 싸 다닐게요."', '"가격이 자꾸 오르니 부담돼서요. 죄송해요, 사장님."', '"월급은 그대로인데 김밥값만 올랐네요."'],

  function partingLine(G, r, why) {

  HOOKS.after.push(function (G, R) {

      if (tasteBad && r.type === 'taste') hit(-14, 'taste', true);

  /* ───────── 진상 손님 선택 사건 ───────── */

  // 1. 다 먹고 환불
  EV.gsRefund = { cat: 'guest', cool: 2, p: G => can(G, 'gsRefund') ? .014 : 0,

          { t: '환불을 거절한다', d: '돈은 나가지 않지만 평판이 1 떨어지고 스트레스가 쌓입니다.' }
        ], data: { amt }, def: 0, who: npc(G, ['점퍼 차림의 손님', '등산복 차림의 손님', '모자 쓴 손님']) };
    } };
  CHOOSE.gsRefund = (G, d, c) => {

  CHOOSE.gsHostage = (G, d, c) => {

  };

  const regAsk = G => { const g = gs(G); return g.list.filter(r => G.month - r.since >= 2); };
  EV.gsDiscount = { cat: 'guest', cool: 2, p: G => (can(G, 'gsDiscount') && regAsk(G).length) ? .02 : 0,
    run(G) {

      return { tone: 'neutral', title: '단골의 할인 요구',
        text: `"사장님, 저 단골인데 500원만 빼 주세요." ${ga(r.name)} 계산대 앞에서 웃으며 말합니다.`,

          { t: '500원 깎아 준다', d: '단골의 마음이 풀리지만 6개월간 월 2만원이 나가고, 20% 확률로 다른 단골도 따라 합니다.' },

  CHOOSE.gsDiscount = (G, d, c) => {

    }
    if (c === 1) { X.spend(G, 3000); r.mood = Math.min(100, r.mood + 7); return `음료수를 건네자 ${eun(r.name)} 못 이기는 척 받아 갔습니다.`; }
    r.mood = Math.max(0, r.mood - 25); r.hurt = 'deny';

  // 4. 네 명 자리를 차지한 한 사람
  EV.gsTable = { cat: 'guest', cool: 2, p: G => (G.tables >= 2 && can(G, 'gsTable')) ? ((lost(G).seat || 0) > 0 ? .035 : .01) : 0,
    run(G) {
      mark(G, 'gsTable'); const amt = X.ri(G, 10, 20) * MAN;
      return { tone: 'neutral', title: '네 명 자리 한 사람',
        text: '점심 피크에 손님 한 명이 네 명 자리를 차지하고 김밥 한 줄로 한 시간째 앉아 있습니다. 대기 줄이 문밖까지 이어집니다.',
        choices: [
          { t: '자리를 옮겨 달라고 한다', d: '70% 확률로 순순히 옮기고, 30% 확률로 불쾌해해 평판이 2 떨어집니다.' },

const TRAITS_K = ['손이 빠름', '음식 솜씨', '칼질 능숙', '체력 좋음', '꼼꼼함', '위생 철저', '아침형'];
const TRAITS_H = ['붙임성 좋음', '손이 빠름', '암산 빠름', '목소리 큼', '체력 좋음', '꼼꼼함', '인사성 밝음'];

function toneOf(w) { return w.hint === '성실해 보임' ? 0 : w.hint === '무난해 보임' ? 1 : 2; }

function ageOf(w) {
  const sk = w.skill | 0;
  if (w.role === 'kitchen') {
    if (w.full) return sk >= 4 ? between(45, 62, w, 'age') : sk === 3 ? between(38, 58, w, 'age') : between(28, 55, w, 'age');
    if (sk >= 4) return between(48, 62, w, 'age');
    return rk(w, 'agegrp') % 100 < 50 ? between(22, 30, w, 'age') : between(42, 60, w, 'age');
  }
  if (w.full) return sk >= 4 ? between(30, 48, w, 'age') : between(25, 42, w, 'age');
  return rk(w, 'agegrp') % 100 < 62 ? between(20, 27, w, 'age') : between(38, 52, w, 'age');
}

function careersOf(w, age) {
  const sk = w.skill | 0, a = place(w, 1), b = place(w, 2), c = place(w, 3), out = [];
  if (w.role === 'kitchen') {
    if (sk >= 4) {
      out.push(a + '분식 주방 ' + (6 + rk(w, 'c1') % 3) + '년', b + '식당 주방 ' + (4 + rk(w, 'c2') % 2) + '년');
      if (rk(w, 'c3') % 2) out.push(c + ' 구내식당 조리 ' + (1 + rk(w, 'c4') % 3) + '년');
    } else if (sk === 3) {
      out.push(a + '식당 주방 2년', b + '분식 주방 1년');
    } else if (sk === 2) {
      out.push(a + '식당 주방 보조 ' + dur(3 + rk(w, 'c1') % 6), '급식 도우미 ' + dur(2 + rk(w, 'c2') % 4));
    } else {
      out.push('주방 경력 없음 (처음 하는 일)');
      out.push(age >= 45 ? '가사·육아 ' + (12 + rk(w, 'c1') % 10) + '년 (재취업)' : '편의점 아르바이트 ' + dur(4 + rk(w, 'c1') % 9));
    }
  } else {
    if (sk >= 4) {
      out.push(a + '식당 홀 ' + (4 + rk(w, 'c1') % 3) + '년', b + '횟집 서빙 ' + (2 + rk(w, 'c2') % 2) + '년');
      if (rk(w, 'c3') % 2) out.push(c + ' 카페 1년 6개월');
    } else if (sk === 3) {
      out.push(a + ' 카페 아르바이트 1년', b + '식당 홀 아르바이트 ' + dur(8 + rk(w, 'c1') % 3));
    } else if (sk === 2) {
      out.push('편의점 아르바이트 ' + dur(4 + rk(w, 'c1') % 5), a + '치킨 홀 아르바이트 ' + dur(3 + rk(w, 'c2') % 4));
    } else {
      out.push('경력 없음 (첫 아르바이트)');
      out.push(age < 28 ? '대학 재학·휴학 중' : '가사·육아 ' + (6 + rk(w, 'c1') % 10) + '년 (재취업)');
    }
  }
  return out;
}

function wishOf(w, age) {
  const part = w.full ? [
    '주 5일 근무 희망', '일요일 휴무 희망', '4대 보험 가입 희망', '명절 휴무 희망', '점심 피크 근무 가능', '야간 마감 근무 가능'
  ] : [
    '주말 근무 가능', '평일 오전만 가능', '평일 오후만 가능', '저녁 시간대 선호', '주 3일 근무 희망',
    age < 28 ? '학기 중에는 오후만 가능' : '자녀 하교 시간 전에 퇴근 희망'
  ];
  let s = pick(part, w, 'wish');
  if (w.role === 'kitchen' && age >= 55 && rk(w, 'back') % 3 === 0) s += ' · 무거운 짐은 조금 곤란';
  return s;
}

function introOf(w) {
  let t = toneOf(w);
  const r = rk(w, 'tone') % 100;
  if (t === 0 && r < 25) t = 1;                   // 인상과 글이 항상 맞지는 않는다
  else if (t === 1 && r < 12) t = 0;
  else if (t === 1 && r < 24) t = 2;
  else if (t === 2 && r < 25) t = 1;
  else if (t === 2 && r < 33) t = 0;
  return pick(INTRO[t], w, 'intro').replace(/\{j\}/g, w.role === 'kitchen' ? '주방' : '홀');
}

function traitsOf(w) {
  const pool = (w.role === 'kitchen' ? TRAITS_K : TRAITS_H).slice(), out = [];
  const n = 2 + rk(w, 'tn') % 2;
  for (let i = 0; i < n; i++) { const j = rk(w, 'tr' + i) % pool.length; out.push(pool.splice(j, 1)[0]); }
  return out;
}

UI.profile = function (G, w) {
  w = w || {};
  const age = ageOf(w);
  return { age, careers: careersOf(w, age), intro: introOf(w), wish: wishOf(w, age), traits: traitsOf(w) };
};

const GEOM = { eyeY: 33, noseY: 37, mouthY: 41, browY: 28.6 };
const f1 = n => Math.round(n * 10) / 10;

function hairStyleOf(w, age, g) {
  const r = rk(w, 'style') % 100;
  const older = age >= 48;
  if (g === 'f') {
    if (older && w.role === 'kitchen') return r < 52 ? 'perm' : r < 72 ? 'bun' : r < 88 ? 'side' : 'bob';
    return ['bob', 'long', 'bun', 'perm', 'side', 'long', 'bob'][rk(w, 'style2') % 7];
  }
  if (g === 'm') {
    if (older && w.role === 'kitchen' && r < 10) return 'perm';
    return ['crop', 'side', 'buzz', 'crop', 'side'][rk(w, 'style2') % 5];
  }
  return ['crop', 'side', 'buzz', 'bob', 'long', 'bun', 'perm'][rk(w, 'style2') % 7];
}

function hairColorOf(w, age) {
  const r = rk(w, 'hc') % 100;
  if (age >= 60) return r < 85 ? 3 : r < 93 ? 1 : 2;
  if (age >= 50) return r < 35 ? 3 : r < 70 ? 1 : 2;
  return r < 62 ? 1 : 2;
}

function circ(cx, cy, r, c) { return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--pp-hair${c})"/>`; }
function hpath(d, c) { return `<path d="${d}" fill="var(--pp-hair${c})"/>`; }

function hairBack(style, c) {
  switch (style) {
    case 'crop': case 'side': case 'buzz': return hpath('M15 31 C13 17 21 11.5 30 11.5 C39 11.5 47 17 45 31 Z', c);
    case 'bob': return hpath('M14 32 C12 16 21 11 30 11 C39 11 48 16 46 32 C46.5 40 45.5 44.5 43.5 46.5 L16.5 46.5 C14.5 44.5 13.5 40 14 32 Z', c);
    case 'long': return hpath('M13 32 C11 14 20 10.5 30 10.5 C40 10.5 49 14 47 32 L48.5 60 L11.5 60 Z', c);
    case 'bun': return circ(30, 9.5, 5.6, c) + hpath('M15.5 30 C14 17 21 13 30 13 C39 13 46 17 44.5 30 Z', c);
    case 'perm': return [[18, 17], [24, 13], [30, 11.5], [36, 13], [42, 17], [14.5, 25], [45.5, 25], [13.5, 33], [46.5, 33], [14.5, 41], [45.5, 41]]
      .map(p => circ(p[0], p[1], 5.6, c)).join('');
  }
  return '';
}

function hairFront(style, c) {
  switch (style) {
    case 'crop': return hpath('M16.6 30 C15 20 20 15 30 15 C40 15 45 20 43.4 30 C42.4 25 40.5 22.5 30 22 C19.5 22.5 17.6 25 16.6 30 Z', c);
    case 'buzz': return hpath('M16.8 29 C15.6 20 20.5 16.5 30 16.5 C39.5 16.5 44.4 20 43.2 29 C42 24.5 40 21 30 20.5 C20 21 18 24.5 16.8 29 Z', c);
    case 'side': return hpath('M16.6 31 C14.6 19 21 13.8 31 14.4 C41 15 46 21 43.4 31 C42.4 25.5 41 23 36.5 22 C30.5 24.5 23 23 20 25.5 C18.6 27 17.6 29 16.6 31 Z', c);
    case 'bob': return hpath('M16.6 30 C14.6 19 21 13.5 30 13.5 C39 13.5 45.4 19 43.4 30 C42 25.5 40 24 30 24 C20 24 18 25.5 16.6 30 Z', c) +
      hpath('M13.6 29 L17.5 29 L17.4 45.5 L13.8 45.5 Z', c) + hpath('M42.5 29 L46.4 29 L46.2 45.5 L42.6 45.5 Z', c);
    case 'long': return hpath('M16.6 31 C14.6 19 21 13.8 31 14.4 C41 15 46 21 43.4 31 C42.4 25.5 41 23 36.5 22 C30.5 24.5 23 23 20 25.5 C18.6 27 17.6 29 16.6 31 Z', c) +
      hpath('M12.8 28 L17.5 29 L17.3 56 L11.5 58 Z', c) + hpath('M42.5 29 L47.2 28 L48.5 58 L42.7 56 Z', c);
    case 'bun': return hpath('M17 28 C16 19.5 21 16 30 16 C39 16 44 19.5 43 28 C41.2 22.5 38 20.5 30 20.5 C22 20.5 18.8 22.5 17 28 Z', c);
    case 'perm': return [[21, 21.2, 4.3], [26, 19.6, 4.3], [31, 19, 4.3], [36, 19.6, 4.3], [40.5, 21.5, 4.1], [13.6, 31, 4], [46.4, 31, 4]]
      .map(p => circ(p[0], p[1], p[2], c)).join('');
  }
  return '';
}

UI.face = function (w, size) {
  w = w || {}; size = size || 44;
  const age = ageOf(w), g = genderOf(w);
  const skin = 'var(--pp-skin' + (1 + rk(w, 'skin') % 3) + ')';
  const style = hairStyleOf(w, age, g), hc = hairColorOf(w, age);
  const cloth = 'var(--pp-cloth' + (1 + rk(w, 'cloth') % 4) + ')';
  const eyeShape = rk(w, 'eye') % 3;
  const glasses = rk(w, 'glass') % 100 < (age >= 50 ? 35 : 22);
  const cheek = rk(w, 'cheek') % 100, hall = w.role === 'hall';
  const mood = w.hint === '성실해 보임' ? 'smile' : w.hint === '오래 못 버틸 듯' ? 'tired' : 'flat';
  const ink = 'stroke="var(--pp-ink)" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const s = [];
  s.push(`<rect width="60" height="75" fill="var(--pp-bg)"/>`);
  s.push(`<g class="pp-hb">${hairBack(style, hc)}</g>`);
  s.push(`<rect x="26" y="43" width="8" height="13" fill="${skin}"/><ellipse cx="30" cy="49.5" rx="7.2" ry="3.4" fill="var(--pp-ink)" opacity=".16"/>`);
  s.push(`<path d="M2 75 C3 62 13 55 24 52.5 L36 52.5 C47 55 57 62 58 75 Z" fill="${cloth}"/>`);
  if (hall) {
    s.push(`<path d="M25.5 52.5 L30 59.5 L34.5 52.5 Z" fill="${skin}"/>`);
    s.push(`<path d="M23.2 51.8 L30 60 L25 63.5 L20.2 55 Z M36.8 51.8 L30 60 L35 63.5 L39.8 55 Z" fill="var(--pp-collar)" stroke="var(--pp-ink)" stroke-width=".4" stroke-linejoin="round"/>`);
  } else {
    s.push(`<path d="M24.2 52.5 Q30 59.5 35.8 52.5 Z" fill="${skin}"/>`);
  }
  s.push(`<ellipse cx="17" cy="34" rx="2" ry="3" fill="${skin}"/><ellipse cx="43" cy="34" rx="2" ry="3" fill="${skin}"/>`);
  s.push(`<ellipse class="pp-head" cx="30" cy="33" rx="13" ry="15" fill="${skin}"/>`);
  if (cheek < 25) s.push(`<ellipse cx="22.4" cy="38.6" rx="3" ry="1.8" fill="var(--pp-blush)" opacity=".38"/><ellipse cx="37.6" cy="38.6" rx="3" ry="1.8" fill="var(--pp-blush)" opacity=".38"/>`);
  else if (cheek < 40) s.push(`<g fill="var(--pp-ink)" opacity=".42"><circle cx="26.4" cy="36.4" r=".5"/><circle cx="24.4" cy="37.4" r=".5"/><circle cx="27.4" cy="38.2" r=".5"/><circle cx="33.6" cy="36.4" r=".5"/><circle cx="35.6" cy="37.4" r=".5"/><circle cx="32.6" cy="38.2" r=".5"/></g>`);
  if (age >= 50) {
    s.push(`<g ${ink} stroke-width=".8" opacity=".38"><path d="M25.6 38.4 Q24.4 41.2 25.8 43.6"/><path d="M34.4 38.4 Q35.6 41.2 34.2 43.6"/>` +
      (age >= 56 ? `<path d="M19.6 32 L21.4 32.8"/><path d="M19.8 34.4 L21.6 34.2"/><path d="M40.4 32 L38.6 32.8"/><path d="M40.2 34.4 L38.4 34.2"/>` : '') + `</g>`);
  }
  /* 눈 */
  const ex = [24.5, 35.5], dx = mood === 'tired' ? 0.8 : 0, y = GEOM.eyeY;
  const eyes = ex.map(x => {
    const cx = f1(x + dx);
    if (mood === 'tired') return `<ellipse class="pp-eye" cx="${cx}" cy="${y + 0.3}" rx="${eyeShape === 2 ? 2.1 : 1.7}" ry="0.9" fill="var(--pp-ink)"/>` +
      `<path d="M${f1(x - 2.6)} ${y - 0.7} Q${x} ${y - 1.9} ${f1(x + 2.6)} ${y - 0.7}" ${ink} stroke-width=".9"/>`;
    if (eyeShape === 0) return `<circle class="pp-eye" cx="${cx}" cy="${y}" r="1.5" fill="var(--pp-ink)"/>`;
    if (eyeShape === 1) return `<ellipse class="pp-eye" cx="${cx}" cy="${y}" rx="2" ry="1.25" fill="var(--pp-ink)"/>`;
    return `<ellipse class="pp-eye" cx="${cx}" cy="${y}" rx="2.2" ry=".9" fill="var(--pp-ink)"/>`;
  });
  s.push(eyes.join(''));
  if (mood === 'tired') s.push(`<g ${ink} stroke-width=".7" opacity=".3"><path d="M22.4 35.4 Q24.5 36.6 26.6 35.4"/><path d="M33.4 35.4 Q35.5 36.6 37.6 35.4"/></g>`);
  /* 눈썹 */
  const by = GEOM.browY, bc = hc === 3 ? 2 : hc;
  const brow = mood === 'tired'
    ? `M21.8 ${f1(by + 1.1)} L27.4 ${f1(by - 0.6)} M38.2 ${f1(by + 1.1)} L32.6 ${f1(by - 0.6)}`
    : mood === 'smile'
      ? `M22 ${f1(by + 0.4)} Q24.8 ${f1(by - 1.3)} 27.6 ${f1(by + 0.2)} M38 ${f1(by + 0.4)} Q35.2 ${f1(by - 1.3)} 32.4 ${f1(by + 0.2)}`
      : `M22 ${by} L27.6 ${f1(by - 0.2)} M38 ${by} L32.4 ${f1(by - 0.2)}`;
  s.push(`<path class="pp-brow" d="${brow}" fill="none" stroke="var(--pp-hair${hc === 3 ? 3 : bc})" stroke-width="1.3" stroke-linecap="round"${hc === 3 ? ' opacity=".85"' : ''}/>`);
  /* 코·입 */
  s.push(`<path class="pp-nose" d="M30 35.2 Q28.7 37 30.5 37.4" ${ink} stroke-width=".8" opacity=".65"/>`);
  const mouth = mood === 'smile' ? 'M26.4 40.4 Q30 43.6 33.6 40.4' : mood === 'tired' ? 'M27.4 41.7 L32.6 41.7' : 'M27 41.2 Q30 42 33 41.2';
  s.push(`<path class="pp-mouth" d="${mouth}" fill="none" stroke="var(--pp-mouth)" stroke-width="1.2" stroke-linecap="round"/>`);
  /* 안경 */
  if (glasses) {
    s.push(`<g fill="var(--pp-bg)" fill-opacity=".14" stroke="var(--pp-glass)" stroke-width="1" stroke-linejoin="round">` +
      `<rect x="20.2" y="29.8" width="8.6" height="6.6" rx="2.6"/><rect x="31.2" y="29.8" width="8.6" height="6.6" rx="2.6"/>` +
      `<path fill="none" d="M28.8 32.4 Q30 31.5 31.2 32.4 M20.2 32 L17.4 31.6 M39.8 32 L42.6 31.6"/></g>`);
  }
  s.push(`<g class="pp-hf">${hairFront(style, hc)}</g>`);
  const px = Math.round(size * 10) / 10, py = Math.round(size * 1.25 * 10) / 10;
  return `<svg class="pp-face" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 75" width="${px}" height="${py}" role="img" aria-label="${UI.esc(w.name || '')} 증명사진">${s.join('')}</svg>`;
};

UI.faceBtn = function (w, size) {

};

  '무난해 보임': ['말수는 적지만 대답은 정확함.', '특별한 인상은 없음. 무난함.', '시간 조건은 서로 맞는 편.', '처음엔 어색해했지만 곧 편해짐.', '묻는 말에만 짧게 대답함.', '옷차림이 단정함.'],
